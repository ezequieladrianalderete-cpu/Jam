<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Subí tu música — JAM 2026</title>
    <link rel="icon" type="image/png" href="/imgs/logo-int.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Outfit", sans-serif;
        background: #080808;
        color: #f8f5ee;
        min-height: 100vh;
        padding: 20px;
        line-height: 1.55;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }
      .brand {
        text-align: center;
        padding: 32px 0 24px;
      }
      .brand .logo {
        font-family: "Cormorant Garamond", serif;
        font-size: 54px;
        font-weight: 700;
        color: #c9a84c;
        letter-spacing: 8px;
        line-height: 1;
      }
      .brand .tag {
        font-size: 11px;
        letter-spacing: 3px;
        color: rgba(248, 245, 238, 0.5);
        text-transform: uppercase;
        margin-top: 6px;
      }
      .card {
        background: #141414;
        border: 1px solid rgba(201, 168, 76, 0.2);
        border-radius: 18px;
        padding: 28px;
        margin-bottom: 18px;
      }
      .codigo {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        letter-spacing: 2px;
        color: #c9a84c;
        text-align: center;
        padding: 8px 14px;
        background: #1a1600;
        border: 1px dashed rgba(201, 168, 76, 0.5);
        border-radius: 10px;
        display: inline-block;
        margin-bottom: 14px;
      }
      .nombre-grupo {
        font-family: "Cormorant Garamond", serif;
        font-size: 32px;
        font-weight: 600;
        color: #f8f5ee;
        text-align: center;
        margin-bottom: 6px;
        line-height: 1.15;
      }
      .subtitle {
        font-size: 12px;
        color: rgba(248, 245, 238, 0.5);
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .section-title {
        font-size: 11px;
        letter-spacing: 2.5px;
        color: #c9a84c;
        text-transform: uppercase;
        font-weight: 700;
        margin: 24px 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      }
      .integrante {
        padding: 10px 14px;
        background: #1a1600;
        border-left: 3px solid #c9a84c;
        border-radius: 6px;
        margin-bottom: 6px;
      }
      .integrante .sub-cod {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: #c9a84c;
        letter-spacing: 1px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .integrante .sub-nm {
        font-family: "Cormorant Garamond", serif;
        font-size: 17px;
        color: #f8f5ee;
        font-weight: 600;
      }
      .drop {
        border: 2px dashed rgba(201, 168, 76, 0.4);
        border-radius: 14px;
        padding: 36px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        background: #0e0e0e;
      }
      .drop:hover,
      .drop.over {
        border-color: #c9a84c;
        background: #1a1600;
      }
      .drop .icon {
        font-size: 38px;
        margin-bottom: 10px;
      }
      .drop .label {
        font-family: "Cormorant Garamond", serif;
        font-size: 22px;
        color: #f8f5ee;
        font-weight: 600;
      }
      .drop .hint {
        font-size: 12px;
        color: rgba(248, 245, 238, 0.5);
        margin-top: 6px;
      }
      .file-input {
        display: none;
      }
      .picked {
        padding: 14px;
        background: #0e0e0e;
        border-radius: 10px;
        border: 1px solid rgba(201, 168, 76, 0.3);
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .picked .fn {
        flex: 1;
        font-size: 13px;
        color: #f8f5ee;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .picked .sz {
        font-size: 11px;
        color: rgba(248, 245, 238, 0.5);
        font-family: "JetBrains Mono", monospace;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 14px 24px;
        background: #c9a84c;
        color: #0a0a0a;
        border: none;
        border-radius: 10px;
        font-family: "Outfit", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        margin-top: 14px;
        transition: all 0.2s;
      }
      .btn:hover {
        background: #e8a838;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-secondary {
        background: transparent;
        color: #c9a84c;
        border: 1px solid #c9a84c;
        margin-top: 8px;
      }
      .btn-secondary:hover {
        background: #1a1600;
      }
      .progress {
        height: 6px;
        background: #1a1600;
        border-radius: 3px;
        overflow: hidden;
        margin: 14px 0 6px;
      }
      .progress .bar {
        height: 100%;
        background: linear-gradient(90deg, #c9a84c, #e8a838);
        width: 0%;
        transition: width 0.3s;
      }
      .progress-text {
        font-size: 11px;
        color: rgba(248, 245, 238, 0.6);
        text-align: center;
        font-family: "JetBrains Mono", monospace;
      }
      .alert {
        padding: 14px;
        border-radius: 10px;
        margin-top: 14px;
        font-size: 13px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .alert-ok {
        background: rgba(76, 175, 125, 0.1);
        border: 1px solid #4caf7d;
        color: #4caf7d;
      }
      .alert-err {
        background: rgba(224, 82, 76, 0.1);
        border: 1px solid #e0524c;
        color: #e0524c;
      }
      .alert-warn {
        background: rgba(232, 168, 56, 0.1);
        border: 1px solid #e8a838;
        color: #e8a838;
      }
      .status {
        padding: 10px 14px;
        background: #1a1600;
        border-radius: 8px;
        margin-top: 12px;
        font-size: 12px;
        color: rgba(248, 245, 238, 0.7);
        text-align: center;
      }
      .status.cargada {
        background: rgba(76, 175, 125, 0.1);
        border: 1px solid #4caf7d;
        color: #4caf7d;
      }
      .audio {
        width: 100%;
        margin-top: 12px;
        border-radius: 8px;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: rgba(248, 245, 238, 0.5);
      }
      .footer {
        text-align: center;
        font-size: 11px;
        color: rgba(248, 245, 238, 0.35);
        padding: 24px 0;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <div class="logo">JAM</div>
        <div class="tag">Subí tu música · 2026</div>
      </div>
      <div id="content">
        <div class="card loading">Cargando inscripción…</div>
      </div>
      <div class="footer">
        <strong style="color: rgba(248, 245, 238, 0.6)"
          >JAM Inter América Dance Competition 2026</strong
        ><br />
        2, 3 y 4 de Octubre · Palais Rouge, CABA<br />
        ¿Dudas? Escribí a info@jamcompetencia.com
      </div>
    </div>

    <script>
      // === Config ===
      var SB_URL = "https://paexpktmcytccjphoppu.supabase.co";
      var SB_ANON =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZXhwa3RtY3l0Y2NqcGhvcHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDg3MzIsImV4cCI6MjA5NDg4NDczMn0.iKuJJm2-8KITTLwHOY1YrbzRgXcuAERXtHg7cQ_K3Yg";
      var BUCKET = "musica";
      var MAX_MB = 50;

      // === Helpers ===
      function $(q, root) {
        return (root || document).querySelector(q);
      }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function fmtSize(b) {
        if (b < 1024) return b + " B";
        if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
        return (b / (1024 * 1024)).toFixed(1) + " MB";
      }
      function codigoFor(ins) {
        var map = {
          reg: { c: "JAM-REG", o: 1 },
          rep: { c: "JAM-REP", o: 10 },
          nac: { c: "JAM-NAC", o: 200 },
          int: { c: "JAM-INTER", o: 1000 },
        };
        var cfg = map[ins.instancia] || map.reg;
        return cfg.c + "-" + String(cfg.o + (ins._pos || 0)).padStart(4, "0");
      }
      function showError(msg) {
        $("#content").innerHTML =
          '<div class="card"><div class="alert alert-err"><div><strong>Error</strong><br>' +
          esc(msg) +
          "</div></div></div>";
      }
      function vencimientoInfo(ins) {
        if (!ins.vencimiento_musica) return null;
        var venc = new Date(ins.vencimiento_musica);
        if (isNaN(venc.getTime())) return null;
        return {
          vencido: Date.now() > venc.getTime(),
          fechaTxt: venc.toLocaleDateString("es-AR", {
            day: "numeric",
            month: "long",
            year: "numeric",
          }),
        };
      }

      // === Estado ===
      var state = {
        token: null,
        ins: null,
        codigo: "",
        pickedFile: null,
      };

      // === Init ===
      async function init() {
        state.token = new URLSearchParams(location.search).get("token");
        if (!state.token) {
          return showError(
            "Falta el token en la URL. Revisá el link de tu mail.",
          );
        }
        try {
          // 1. Buscar inscripción por token
          var r = await fetch(
            SB_URL +
              "/rest/v1/inscripciones?musica_token=eq." +
              encodeURIComponent(state.token) +
              "&select=*",
            {
              headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON },
            },
          );
          if (!r.ok)
            throw new Error("Error al buscar inscripción (" + r.status + ")");
          var data = await r.json();
          if (!data || !data.length)
            return showError(
              "No se encontró inscripción con ese token. Verificá el link.",
            );
          state.ins = data[0];

          // 2. Calcular posición para código legible
          var r2 = await fetch(
            SB_URL +
              "/rest/v1/inscripciones?instancia=eq." +
              state.ins.instancia +
              "&select=id,created_at&order=created_at.asc",
            {
              headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON },
            },
          );
          var allInst = await r2.json();
          var idx = allInst.findIndex(function (x) {
            return x.id === state.ins.id;
          });
          state.ins._pos = idx >= 0 ? idx : 0;
          state.codigo = codigoFor(state.ins);

          render();
        } catch (e) {
          showError(e.message || "Error inesperado");
        }
      }

      // === Render ===
      function render() {
        var ins = state.ins;
        var integrantes = [];
        try {
          integrantes =
            typeof ins.integrantes === "string"
              ? JSON.parse(ins.integrantes)
              : ins.integrantes || [];
        } catch (e) {}
        if (!Array.isArray(integrantes)) integrantes = [];
        var nombreGrupo = ins.nombre_grupo || ins.nombre || "Participante";

        var yaCargada = ins.musica_estado === "cargada" && ins.musica_url;

        var intHtml = integrantes.length
          ? integrantes
              .map(function (it, i) {
                var n =
                  (it && (it.nombre || it.name)) || "Integrante " + (i + 1);
                return (
                  '<div class="integrante"><div class="sub-cod">' +
                  esc(state.codigo) +
                  "-" +
                  (i + 1) +
                  '</div><div class="sub-nm">' +
                  esc(n) +
                  "</div></div>"
                );
              })
              .join("")
          : "";

        var html =
          '<div class="card">' +
          '<div style="text-align:center"><div class="codigo">' +
          esc(state.codigo) +
          "</div></div>" +
          '<div class="nombre-grupo">' +
          esc(nombreGrupo) +
          "</div>" +
          '<div class="subtitle">Responsable: ' +
          esc(ins.nombre || "—") +
          "</div>" +
          (integrantes.length
            ? '<div class="section-title">Integrantes (' +
              integrantes.length +
              ")</div>" +
              intHtml
            : "") +
          "</div>";

        if (yaCargada) {
          var fueraNota = ins.musica_fuera_termino
            ? '<div class="alert alert-warn" style="margin-top:14px"><div>⚠ Esta música se subió fuera del plazo sin cargo. Se va a aplicar un recargo aparte; te contactaremos para coordinarlo.</div></div>'
            : "";
          html +=
            '<div class="card">' +
            '<div class="section-title" style="margin-top:0">Música cargada</div>' +
            '<div class="status cargada">✓ Ya cargaste tu canción</div>' +
            fueraNota +
            '<div style="margin-top:14px;padding:12px;background:#0e0e0e;border-radius:10px"><div style="font-size:13px;color:#F8F5EE;font-weight:600;margin-bottom:4px">' +
            esc(ins.musica_nombre || "archivo.mp3") +
            "</div></div>" +
            '<audio class="audio" controls src="' +
            esc(ins.musica_url) +
            '"></audio>' +
            '<button class="btn btn-secondary" onclick="document.getElementById(\'reemplazar\').click()">Reemplazar archivo</button>' +
            '<input id="reemplazar" type="file" accept="audio/*" class="file-input">' +
            "</div>";
        } else {
          var venc = vencimientoInfo(ins);
          var vencNota = "";
          if (venc && venc.vencido) {
            vencNota =
              '<div class="alert alert-warn"><div>⚠ El plazo para subir sin cargo venció el <strong>' +
              esc(venc.fechaTxt) +
              "</strong>. Podés subir tu música igual, pero se te va a cobrar un recargo aparte.</div></div>";
          } else if (venc) {
            vencNota =
              '<div class="status">Tenés hasta el <strong style="color:#F8F5EE">' +
              esc(venc.fechaTxt) +
              "</strong> para subir tu música sin cargo extra.</div>";
          }
          html +=
            '<div class="card">' +
            '<div class="section-title" style="margin-top:0">Subí tu canción</div>' +
            vencNota +
            '<div class="drop" id="drop"><div class="icon">♪</div><div class="label">Elegí o arrastrá un archivo</div><div class="hint">MP3, WAV, M4A · hasta ' +
            MAX_MB +
            " MB</div></div>" +
            '<input id="fileInput" type="file" accept="audio/*" class="file-input">' +
            '<div id="pickedBox"></div>' +
            '<button class="btn" id="btnUpload" disabled>SUBIR CANCIÓN</button>' +
            '<div id="progressBox"></div>' +
            '<div id="msgBox"></div>' +
            "</div>";
        }

        $("#content").innerHTML = html;
        bindUpload();
      }

      // === Bind ===
      function bindUpload() {
        var drop = $("#drop");
        var input = $("#fileInput");
        var reInput = $("#reemplazar");
        var btn = $("#btnUpload");

        if (drop && input) {
          drop.onclick = function () {
            input.click();
          };
          drop.ondragover = function (e) {
            e.preventDefault();
            drop.classList.add("over");
          };
          drop.ondragleave = function () {
            drop.classList.remove("over");
          };
          drop.ondrop = function (e) {
            e.preventDefault();
            drop.classList.remove("over");
            if (e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]);
          };
          input.onchange = function (e) {
            if (e.target.files[0]) pickFile(e.target.files[0]);
          };
        }
        if (reInput) {
          reInput.onchange = function (e) {
            if (e.target.files[0]) {
              pickFile(e.target.files[0]);
              doUpload();
            }
          };
        }
        if (btn) {
          btn.onclick = doUpload;
        }
      }

      function pickFile(file) {
        if (!file) return;
        // Validar
        var mb = file.size / (1024 * 1024);
        if (mb > MAX_MB) {
          $("#msgBox").innerHTML =
            '<div class="alert alert-err">El archivo supera ' +
            MAX_MB +
            " MB (" +
            mb.toFixed(1) +
            " MB).</div>";
          return;
        }
        if (
          !file.type.startsWith("audio/") &&
          !/\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(file.name)
        ) {
          $("#msgBox").innerHTML =
            '<div class="alert alert-warn">El archivo no parece ser de audio. ¿Estás seguro?</div>';
        } else {
          $("#msgBox").innerHTML = "";
        }
        state.pickedFile = file;
        $("#pickedBox").innerHTML =
          '<div class="picked"><div style="color:#C9A84C;font-size:20px">♪</div><div class="fn">' +
          esc(file.name) +
          '</div><div class="sz">' +
          fmtSize(file.size) +
          "</div></div>";
        $("#btnUpload").disabled = false;
      }

      // === Upload + PATCH ===
      async function doUpload() {
        var file = state.pickedFile;
        if (!file) return;
        var btn = $("#btnUpload");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "SUBIENDO…";
        }
        $("#progressBox").innerHTML =
          '<div class="progress"><div class="bar" id="bar"></div></div><div class="progress-text" id="pctTxt">0%</div>';
        $("#msgBox").innerHTML = "";

        try {
          // 1. Subir al bucket
          var ext = (file.name.split(".").pop() || "mp3").toLowerCase();
          var safeCod = state.codigo.replace(/[^A-Za-z0-9\-]/g, "");
          var path = safeCod + "-" + Date.now() + "." + ext;

          // Upload con XHR para tener progreso
          var publicUrl = await new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open(
              "POST",
              SB_URL +
                "/storage/v1/object/" +
                BUCKET +
                "/" +
                encodeURIComponent(path),
            );
            xhr.setRequestHeader("apikey", SB_ANON);
            xhr.setRequestHeader("Authorization", "Bearer " + SB_ANON);
            xhr.setRequestHeader(
              "Content-Type",
              file.type || "application/octet-stream",
            );
            xhr.setRequestHeader("x-upsert", "true");
            xhr.upload.onprogress = function (e) {
              if (e.lengthComputable) {
                var pct = Math.round((e.loaded * 100) / e.total);
                var bar = $("#bar");
                if (bar) bar.style.width = pct + "%";
                var txt = $("#pctTxt");
                if (txt) txt.textContent = pct + "%";
              }
            };
            xhr.onload = function () {
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve(
                  SB_URL + "/storage/v1/object/public/" + BUCKET + "/" + path,
                );
              } else {
                reject(
                  new Error(
                    "Upload falló: HTTP " +
                      xhr.status +
                      " " +
                      xhr.responseText.substring(0, 200),
                  ),
                );
              }
            };
            xhr.onerror = function () {
              reject(new Error("Error de red durante upload"));
            };
            xhr.send(file);
          });

          var bar = $("#bar");
          if (bar) bar.style.width = "100%";
          var txt = $("#pctTxt");
          if (txt) txt.textContent = "Asociando a tu inscripción…";

          // 2. PATCH a la inscripción (CRÍTICO - este es el fix)
          var venc = vencimientoInfo(state.ins);
          var patchBody = {
            musica_url: publicUrl,
            musica_nombre: file.name,
            musica_estado: "cargada",
          };
          if (venc && venc.vencido) patchBody.musica_fuera_termino = true;

          var patchRes = await fetch(
            SB_URL + "/rest/v1/inscripciones?id=eq." + state.ins.id,
            {
              method: "PATCH",
              headers: {
                apikey: SB_ANON,
                Authorization: "Bearer " + SB_ANON,
                "Content-Type": "application/json",
                Prefer: "return=representation",
              },
              body: JSON.stringify(patchBody),
            },
          );

          if (!patchRes.ok) {
            var errTxt = await patchRes.text();
            throw new Error(
              "No se pudo asociar a tu inscripción (HTTP " +
                patchRes.status +
                "): " +
                errTxt.substring(0, 200),
            );
          }

          // Verificar que efectivamente quedó guardado
          var verify = await patchRes.json();
          if (!verify || !verify[0] || !verify[0].musica_url) {
            throw new Error(
              "La inscripción se actualizó pero no se confirmó la URL. Contactá a info@jamcompetencia.com",
            );
          }

          // 3. Mostrar éxito
          state.ins.musica_url = publicUrl;
          state.ins.musica_nombre = file.name;
          state.ins.musica_estado = "cargada";
          if (venc && venc.vencido) state.ins.musica_fuera_termino = true;

          $("#progressBox").innerHTML = "";
          $("#msgBox").innerHTML =
            '<div class="alert alert-ok"><div><strong>¡Listo!</strong><br>Tu música quedó cargada correctamente.</div></div>';

          // Re-render para mostrar estado "cargada"
          setTimeout(function () {
            render();
          }, 1800);
        } catch (e) {
          $("#progressBox").innerHTML = "";
          $("#msgBox").innerHTML =
            '<div class="alert alert-err"><div><strong>No se pudo subir</strong><br>' +
            esc(e.message || "Error desconocido") +
            "</div></div>";
          if (btn) {
            btn.disabled = false;
            btn.textContent = "REINTENTAR";
          }
        }
      }

      // === Boot ===
      init();
    </script>
  </body>
</html>
