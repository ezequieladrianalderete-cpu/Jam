<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Admin — JAM 2026</title>
    <link rel="icon" type="image/png" href="/imgs/logo-int.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>

        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Outfit", sans-serif;
        background: #080808;
        color: #f8f5ee;
        min-height: 100vh;
      }
      .login {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
      }
      .login h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: 64px;
        color: #c9a84c;
        letter-spacing: 8px;
        font-weight: 700;
      }
      .login p {

        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 8px 0 28px;

      .login input {

        color: #f8f5ee;

        font-size: 15px;
        margin-bottom: 14px;
        text-align: center;
        font-family: inherit;

      .login input:focus {

        border-color: #c9a84c;
      }
      .login button {

        color: #0a0a0a;
        border: none;

        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        font-family: "Outfit", sans-serif;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .app {
        display: none;
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid #2a2a2a;
        margin-bottom: 20px;

      .topbar h1 {

      .stat.green {

      .status-pill.pend {

        color: #e8a838;
      }
      .status-pill.err {

      .status-pill.empty {

        border-color: rgba(248, 245, 238, 0.15);
        color: rgba(248, 245, 238, 0.4);
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        align-items: center;
      }
      .f-select {
        background: #141414;
        border: 1px solid #2a2a2a;
        color: #f8f5ee;
        padding: 9px 12px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        min-width: 130px;
      }
      .f-select:focus {
        outline: none;
        border-color: #c9a84c;
      }
      .f-select.active {
        border-color: #c9a84c;
        color: #c9a84c;
      }
      .f-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #141414;
        border: 1px solid #2a2a2a;
        color: rgba(248, 245, 238, 0.7);
        padding: 9px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;

      .f-toggle.on {
        border-color: #e8a838;
        background: rgba(232, 168, 56, 0.1);
        color: #e8a838;

      .f-clear {

        border: none;
        color: rgba(248, 245, 238, 0.4);

        font-size: 11px;

      }
      .f-count {
        font-size: 11px;
        color: rgba(248, 245, 238, 0.5);
        margin-left: auto;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9998;
        align-items: center;
        justify-content: center;
        padding: 20px;
        backdrop-filter: blur(4px);
      }
      .modal.open {
        display: flex;
      }
      .modal-box {
        background: #141414;
        border: 1px solid #2a2a2a;
        border-radius: 14px;
        max-width: 900px;
        width: 100%;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #2a2a2a;
      }
      .modal-head h3 {
        font-family: "Cormorant Garamond", serif;
        color: #c9a84c;
        font-size: 22px;
        font-weight: 600;

      .modal-close {

        cursor: pointer;

      }
      .modal-close:hover {
        color: #f8f5ee;
      }
      .modal-body {
        flex: 1;
        overflow: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

      }
      .modal-body img {

      .modal-body iframe {

      .modal-foot {

        border-top: 1px solid #2a2a2a;

      .empty {

      }
      .mus-row {

      }
      .mus-row-head {

        align-items: center;

      }
      .mus-audio {

      }
      .mus-empty {

      .mus-progress {

      }
      .mus-progress .bar {

      .mus-pct {
        font-size: 11px;
        color: rgba(248, 245, 238, 0.6);
        margin-top: 4px;
      }
      .mus-msg {

        margin-top: 8px;
      }
      .det-block {

      .det-title {

        text-transform: uppercase;

        margin-bottom: 8px;
      }
      #toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #141414;
        border-left: 3px solid #c9a84c;
        padding: 14px 22px;
        border-radius: 8px;
        font-size: 13px;

        display: none;
        max-width: 380px;
      }
      #toast.err {
        border-color: #e0524c;
      }
      #toast.ok {
        border-color: #4caf7d;
      }
      input[type="number"] {
        background: #141414;
        border: 1px solid #2a2a2a;
        color: #f8f5ee;
        padding: 9px 12px;
        border-radius: 7px;
        font-family: inherit;
        font-size: 13px;
        width: 100%;
      }
      input[type="number"]:focus {
        outline: none;
        border-color: #c9a84c;
      }
      @media (max-width: 640px) {
        .app {
          padding: 12px;
        }
        .topbar {
          flex-wrap: wrap;
          gap: 10px;
        }
        .topbar h1 {
          font-size: 22px;
          letter-spacing: 2px;
        }
        .logout {
          padding: 6px 10px;
          font-size: 11px;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .stat-value {
          font-size: 22px;
        }
        .tabs {
          gap: 0;
          overflow-x: auto;
          flex-wrap: nowrap;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar {
          display: none;
        }
        .tab {
          padding: 10px 12px;
          font-size: 12px;
          white-space: nowrap;
        }
        .filters {
          flex-direction: column;
          align-items: stretch;
        }
        .f-select {
          min-width: 0;
          width: 100%;
        }
        .search-box {
          min-width: 0;
        }
        .f-count {
          margin-left: 0;
        }
        .f-toggle {
          width: 100%;
          justify-content: center;
        }
        .toolbar {
          flex-wrap: wrap;
        }
        .btn-primary,
        .btn-secondary {
          flex: 1;
        }
        .ins-row {
          grid-template-columns: 1fr auto;
          grid-template-areas:
            "left  monto"
            "mid   mid"
            "acts  acts";
          gap: 8px;
        }
        .ins-col-left {
          grid-area: left;
        }
        .ins-col-mid {
          grid-area: mid;
        }
        .ins-monto {
          grid-area: monto;
          align-self: start;
          text-align: right;
        }
        .ins-actions {
          grid-area: acts;
          justify-content: flex-start;
        }
        .btn-icon {
          padding: 6px 9px;
          font-size: 11px;
        }
        #toast {
          left: 12px;
          right: 12px;
          max-width: none;
          top: 12px;
        }
        .modal {
          padding: 0;
          align-items: flex-end;
        }
        .modal-box {
          border-radius: 14px 14px 0 0;
          max-height: 90vh;
          max-width: 100%;
        }
        .modal-foot {
          flex-wrap: wrap;
        }
        .modal-foot .info {
          width: 100%;
          margin-bottom: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="login">
        <h1>JAM</h1>
        <p>Panel administrador</p>
        <input
          type="password"
          id="loginPwd"
          placeholder="Clave"
          autocomplete="off"
        />
        <button onclick="tryLogin()">Ingresar</button>
      </div>
    </div>
    <div id="toast"></div>
    <div
      id="compModal"
      class="modal"
      onclick="if (event.target === this) closeComp();"
    ></div>
    <div
      id="musModal"
      class="modal"
      onclick="if (event.target === this) closeMusica();"
    ></div>
    <script>
      const SB_URL = "https://paexpktmcytccjphoppu.supabase.co";
      const SB_ANON =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZXhwa3RtY3l0Y2NqcGhvcHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDg3MzIsImV4cCI6MjA5NDg4NDczMn0.iKuJJm2-8KITTLwHOY1YrbzRgXcuAERXtHg7cQ_K3Yg";
      // ADMIN_PWD removido: ahora se valida bcrypt server-side vía RPC verificar_login
      const INSTANCIAS = {
        reg: { label: "Sedes", code: "JAM-REG", offset: 1 },
        rep: { label: "Repechaje", code: "JAM-REP", offset: 10 },
        nac: { label: "Nacional", code: "JAM-NAC", offset: 200 },
        int: { label: "Inter América", code: "JAM-INTER", offset: 1000 },
      };
      let allInscriptos = [],
        codesById = {},
        currentTab = "inscriptos",
        preciosConfig = null;
      function $(id) {
        return document.getElementById(id);
      }
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
      function toast(t, m) {
        const x = $("toast");
        x.className = t;
        x.textContent = m;
        x.style.display = "block";
        setTimeout(() => (x.style.display = "none"), 3500);
      }
      async function tryLogin() {
        const pwd = $("loginPwd").value;
        if (!pwd) { toast("err", "Ingresá la contraseña"); return; }
        try {
          // Acepta dos usuarios: 'admin' (clásico) o 'director'
          // Detecta cuál username usar según contraseña ingresada
          const usernames = ["admin", "director"];
          let authenticated = false;
          for (const u of usernames) {
            const r = await fetch(SB_URL + "/rest/v1/rpc/verificar_login", {
              method: "POST",
              headers: {
                apikey: SB_ANON,
                Authorization: "Bearer " + SB_ANON,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ p_user: u, p_pass: pwd }),
            });
            if (r.ok) {
              const data = await r.json();
              if (Array.isArray(data) && data.length > 0) {
                authenticated = true;
                sessionStorage.setItem("jam_admin_user", u);
                break;
              }
            }
          }
          if (authenticated) initApp();
          else toast("err", "Clave incorrecta");
        } catch (e) {
          toast("err", "Error de conexión: " + e.message);
        }
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && document.activeElement === $("loginPwd"))
          tryLogin();
      });
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "Escape" &&
          $("compModal") &&
          $("compModal").classList.contains("open")
        )
          closeComp();
        if (
          e.key === "Escape" &&
          $("musModal") &&
          $("musModal").classList.contains("open")
        )
          closeMusica();
      });
      async function initApp() {
        $("root").innerHTML =
          '<div class="app" style="display:block"><div class="topbar"><div><h1>JAM</h1><div class="subtitle">Panel director · 2026</div></div><button class="logout" onclick="logout()">Cerrar sesión</button></div><div class="stats" id="stats"></div><div class="tabs"><div class="tab active" onclick="switchTab(\'inscriptos\')">Inscriptos <span id="cnt-ins">0</span></div><div class="tab" onclick="switchTab(\'dj\')">DJ Mode</div><div class="tab" onclick="switchTab(\'sistema\')">Sistema</div><div class="tab" onclick="switchTab(\'precios\')">💰 Precios</div></div><div id="pane-inscriptos" class="tab-pane active"></div><div id="pane-dj" class="tab-pane"></div><div id="pane-sistema" class="tab-pane"></div><div id="pane-precios" class="tab-pane"></div></div>';
        await loadInscriptos();
        renderActiveTab();
      }
      function logout() {
        location.reload();
      }
      async function loadInscriptos() {
        try {
          const r = await fetch(
            SB_URL + "/rest/v1/inscripciones?select=*&order=created_at.asc",
            {
              headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON },
            },
          );
          allInscriptos = await r.json();
          await computeAllCodes();
          updateStats();
        } catch (e) {
          toast("err", "Error cargando: " + e.message);
        }
      }
      async function computeAllCodes() {
        codesById = {};
        // Respaldo por posición: se calcula primero para no dejar
        // "JAM-???" mientras carga, pero NO es el código real — si se
        // borra una inscripción del medio, esta cuenta se corre para las
        // siguientes y deja de coincidir con el código que el participante
        // ya tiene impreso/en su mail (generado de forma atómica al
        // inscribirse). Se pisa abajo con el valor real de evento.lineup
        // en cuanto se puede leer.
        const groups = { reg: [], rep: [], nac: [], int: [] };
        allInscriptos.forEach((ins) => {
          if (groups[ins.instancia]) groups[ins.instancia].push(ins);
        });
        Object.keys(groups).forEach((k) => {
          const cfg = INSTANCIAS[k];
          groups[k].forEach((ins, idx) => {
            const num = String(cfg.offset + idx).padStart(4, "0");
            codesById[ins.id] = cfg.code + "-" + num;
          });
        });
        try {
          const r = await fetch(
            SB_URL + "/rest/v1/lineup?select=inscripcion_id,codigo_id",
            {
              headers: {
                apikey: SB_ANON,
                Authorization: "Bearer " + SB_ANON,
                "Accept-Profile": "evento",
              },
            },
          );
          const lineup = await r.json();
          (Array.isArray(lineup) ? lineup : []).forEach((row) => {
            if (row.inscripcion_id && row.codigo_id) {
              codesById[row.inscripcion_id] = row.codigo_id;
            }
          });
        } catch (e) {
          console.warn("No se pudo leer el código real desde evento.lineup:", e);
        }
      }
      function getCodigo(ins) {
        return codesById[ins.id] || "JAM-???";
      }
      function updateStats() {
        const total = allInscriptos.length;
        const conf = allInscriptos.filter(
          (i) => i.pago_estado === "confirmado",
        ).length;
        const pend = total - conf;
        const conPendientes = allInscriptos.filter(
          (i) =>
            i.pago_estado !== "confirmado" ||
            i.musica_estado !== "cargada" ||
            !i.comprobante_url,
        ).length;
        // "A recaudar" sumaba el monto_total de TODAS las inscripciones sin
        // mirar pago_estado — incluía lo ya cobrado, así que en realidad
        // mostraba el total facturado, no el saldo pendiente real. Como la
        // base no guarda "cuánto se pagó" (solo el estado), se asume 0
        // pendiente si está confirmado y mitad pendiente si es una seña
        // (coincide con la opción "Seña 50%" que se ofrece en el
        // formulario) — el resto de los estados deben el monto completo.
        let ars = 0,
          usd = 0;
        allInscriptos.forEach((i) => {
          const monto = Number(i.monto_total || 0);
          let debe = monto;
          if (i.pago_estado === "confirmado") debe = 0;
          else if (i.pago_estado === "senia") debe = monto / 2;
          if (i.moneda === "ARS") ars += debe;
          else if (i.moneda === "USD") usd += debe;
        });
        $("cnt-ins").textContent = total;
        $("stats").innerHTML =
          '<div class="stat gold"><div class="stat-label">Inscriptos</div><div class="stat-value">' +
          total +
          "</div></div>" +
          '<div class="stat green"><div class="stat-label">A recaudar ARS</div><div class="stat-value">$ ' +
          ars.toLocaleString("es-AR") +
          "</div></div>" +
          '<div class="stat green"><div class="stat-label">A recaudar USD</div><div class="stat-value">$ ' +
          usd.toLocaleString("en-US") +
          "</div></div>" +
          '<div class="stat amber"><div class="stat-label">Pagos pend / OK</div><div class="stat-value">' +
          pend +
          " / " +
          conf +
          "</div></div>" +
          '<div class="stat amber" style="cursor:pointer" onclick="activarSoloPendientes()"><div class="stat-label">⚠ Con algún pendiente</div><div class="stat-value">' +
          conPendientes +
          "</div></div>";
      }
      function activarSoloPendientes() {
        if (currentTab !== "inscriptos") {
          switchTab("inscriptos");
          setTimeout(activarSoloPendientes, 200);
          return;
        }
        currentFilters.pendientes = true;
        if ($("fPend")) {
          $("fPend").checked = true;
          onFilter();
        }
      }
      function switchTab(tab) {
        currentTab = tab;
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".tab-pane")
          .forEach((t) => t.classList.remove("active"));
        const idx = ["inscriptos", "dj", "sistema", "precios"].indexOf(tab);
        document.querySelectorAll(".tab")[idx].classList.add("active");
        $("pane-" + tab).classList.add("active");
        renderActiveTab();
      }
      function renderActiveTab() {
        if (currentTab === "inscriptos") renderInscriptos();
        else if (currentTab === "dj") renderDJ();
        else if (currentTab === "sistema") renderSistema();
        else if (currentTab === "precios") renderPrecios();
      }
      let currentFilters = {
        q: "",
        instancia: "",
        sede: "",
        cat: "",
        genero: "",
        pendientes: false,
      };
      function renderInscriptos() {
        const pane = $("pane-inscriptos");
        if (!allInscriptos.length) {
          pane.innerHTML =
            '<div class="empty">No hay inscripciones todavía.</div>';
          return;
        }

        // Construir índices dinámicos: solo sedes y cats que tengan al menos 1 inscripto
        const sedeMap = new Map(),
          catMap = new Map();
        allInscriptos.forEach((ins) => {
          if (ins.sede_nombre) {
            sedeMap.set(
              ins.sede_nombre,
              (sedeMap.get(ins.sede_nombre) || 0) + 1,
            );
          }
          (ins.categorias || []).forEach((c) => {
            if (c && c.c != null) {
              const key = c.c + "|" + (c.g || "");
              const cur = catMap.get(key) || {
                count: 0,
                n: c.n || "",
                g: c.g || "",
                c: c.c,
              };
              cur.count++;
              catMap.set(key, cur);
            }
          });
        });

        // Dropdown sedes ordenado alfabéticamente
        const sedesArr = [...sedeMap.entries()].sort((a, b) =>
          a[0].localeCompare(b[0]),
        );
        const sedeOpts =
          '<option value="">Sede: todas</option>' +
          sedesArr
            .map(
              ([nom, cnt]) =>
                '<option value="' +
                esc(nom) +
                '">' +
                esc(nom) +
                " (" +
                cnt +
                ")</option>",
            )
            .join("");

        // Dropdown categorías ordenado por código
        const catsArr = [...catMap.values()].sort((a, b) => a.c - b.c);
        const catOpts =
          '<option value="">Categoría: todas</option>' +
          catsArr
            .map((c) => {
              const lbl =
                "#" +
                c.c +
                (c.g ? " " + c.g.toUpperCase() : "") +
                (c.n ? " — " + c.n : "") +
                " (" +
                c.count +
                ")";
              return (
                '<option value="' +
                c.c +
                "|" +
                esc(c.g || "") +
                '">' +
                esc(lbl) +
                "</option>"
              );
            })
            .join("");

        pane.innerHTML =
          '<div class="filters">' +
          '<input class="search-box" id="searchBox" placeholder="🔍 Buscar nombre, email, código…" oninput="onFilter()">' +
          '<select class="f-select" id="fInstancia" onchange="onFilter()">' +
          '<option value="">Instancia: todas</option>' +
          '<option value="reg">Sedes</option>' +
          '<option value="rep">Repechaje</option>' +
          '<option value="nac">Nacional</option>' +
          '<option value="int">Inter América</option>' +
          "</select>" +
          '<select class="f-select" id="fSede" onchange="onFilter()">' +
          sedeOpts +
          "</select>" +
          '<select class="f-select" id="fCat" onchange="onFilter()">' +
          catOpts +
          "</select>" +
          '<select class="f-select" id="fGenero" onchange="onFilter()">' +
          '<option value="">Género: ambos</option>' +
          '<option value="salsa">Salsa</option>' +
          '<option value="bachata">Bachata</option>' +
          "</select>" +
          '<label class="f-toggle" id="lblPend"><input type="checkbox" id="fPend" onchange="onFilter()">⚠ Solo pendientes</label>' +
          '<button class="f-clear" onclick="clearFilters()">Limpiar</button>' +
          '<span class="f-count" id="filterCount"></span>' +
          "</div>" +
          '<div class="toolbar">' +
          '<button class="btn-primary" onclick="exportExcel()">📥 Exportar Excel</button>' +
          '<button class="btn-secondary" onclick="loadInscriptos().then(renderActiveTab)">↻ Refrescar</button>' +
          "</div>" +
          '<div id="ins-list"></div>';

        // Restaurar valores actuales de filtros (si volvemos a esta tab)
        $("searchBox").value = currentFilters.q;
        $("fInstancia").value = currentFilters.instancia;
        $("fSede").value = currentFilters.sede;
        $("fCat").value = currentFilters.cat;
        $("fGenero").value = currentFilters.genero;
        $("fPend").checked = currentFilters.pendientes;
        if (currentFilters.pendientes) $("lblPend").classList.add("on");

        drawList();
      }

      function onFilter() {
        currentFilters.q = ($("searchBox").value || "").toLowerCase().trim();
        currentFilters.instancia = $("fInstancia").value;
        currentFilters.sede = $("fSede").value;
        currentFilters.cat = $("fCat").value;
        currentFilters.genero = $("fGenero").value;
        currentFilters.pendientes = $("fPend").checked;
        $("lblPend").classList.toggle("on", currentFilters.pendientes);
        // marcar selects activos
        ["fInstancia", "fSede", "fCat", "fGenero"].forEach((id) => {
          const el = $(id);
          if (!el) return;
          el.classList.toggle("active", !!el.value);
        });
        drawList();
      }

      function clearFilters() {
        currentFilters = {
          q: "",
          instancia: "",
          sede: "",
          cat: "",
          genero: "",
          pendientes: false,
        };
        renderInscriptos();
      }

      function matchesFilters(ins) {
        const f = currentFilters;
        if (f.instancia && ins.instancia !== f.instancia) return false;
        if (f.sede && ins.sede_nombre !== f.sede) return false;
        if (f.cat) {
          const [c, g] = f.cat.split("|");
          const ok = (ins.categorias || []).some(
            (x) => String(x.c) === c && (g === "" || x.g === g),
          );
          if (!ok) return false;
        }
        if (f.genero) {
          const ok = (ins.categorias || []).some((x) => x.g === f.genero);
          if (!ok) return false;
        }
        if (f.pendientes) {
          const pagoOk = ins.pago_estado === "confirmado";
          const musOk = ins.musica_estado === "cargada";
          const compOk = !!ins.comprobante_url;
          if (pagoOk && musOk && compOk) return false;
        }
        if (f.q) {
          const cod = (codesById[ins.id] || "").toLowerCase();
          const blob = (
            cod +
            " " +
            (ins.nombre || "") +
            " " +
            (ins.nombre_grupo || "") +
            " " +
            (ins.email || "") +
            " " +
            (ins.celular || "") +
            " " +
            (ins.pais || "") +
            " " +
            (ins.sede_nombre || "")
          ).toLowerCase();
          if (!blob.includes(f.q)) return false;
        }
        return true;
      }

      function drawList() {
        const filtered = allInscriptos.filter(matchesFilters);
        $("filterCount").textContent =
          filtered.length + " / " + allInscriptos.length + " inscriptos";
        if (!filtered.length) {
          $("ins-list").innerHTML =
            '<div class="empty">Ninguna inscripción coincide con los filtros.</div>';
          return;
        }
        $("ins-list").innerHTML = filtered.map(renderRow).join("");
      }

      function renderRow(ins) {
        const cod = getCodigo(ins);
        const inst = INSTANCIAS[ins.instancia]?.label || ins.instancia;
        const monto =
          (ins.moneda || "ARS") +
          " " +
          Number(ins.monto_total || 0).toLocaleString("es-AR");

        // Status pills (música / pago / comprobante)
        const pagoState = ins.pago_estado || "pendiente";
        const pagoPill =
          pagoState === "confirmado"
            ? '<span class="status-pill ok" title="Pago confirmado"><span class="ico">✓</span>Pago</span>'
            : pagoState === "senia"
              ? '<span class="status-pill pend" title="Seña confirmada (50%)"><span class="ico">½</span>Seña</span>'
              : pagoState === "rechazado"
                ? '<span class="status-pill err" title="Pago rechazado"><span class="ico">✗</span>Pago</span>'
                : '<span class="status-pill pend" title="Pago pendiente"><span class="ico">⏳</span>Pago</span>';

        const musState = ins.musica_estado || "pendiente";
        const musPill =
          musState === "cargada"
            ? '<span class="status-pill ok" title="Música cargada"><span class="ico">✓</span>Música</span>'
            : musState === "fuera_de_termino"
              ? '<span class="status-pill err" title="Música fuera de término"><span class="ico">!</span>Música</span>'
              : '<span class="status-pill pend" title="Música pendiente"><span class="ico">⏳</span>Música</span>';
        const recargoPill = ins.musica_fuera_termino
          ? '<span class="status-pill pend" title="Música subida fuera de término: cobrar recargo">$ Recargo</span>'
          : "";

        const compPill = ins.comprobante_url
          ? '<span class="status-pill ok" title="Comprobante subido"><span class="ico">📎</span>Compr.</span>'
          : '<span class="status-pill empty" title="Sin comprobante"><span class="ico">○</span>Compr.</span>';

        // Comprobante de clasificación (solo Nacional: certificado de haber
        // aprobado en la sede, se pide al inscribirse a la Final Nacional).
        const clasifPill =
          ins.instancia === "nac"
            ? ins.clasif_url
              ? '<span class="status-pill ok" title="Comprobante de clasificación subido"><span class="ico">🏅</span>Clasif.</span>'
              : '<span class="status-pill empty" title="Sin comprobante de clasificación"><span class="ico">○</span>Clasif.</span>'
            : "";

        // Sede / país
        let sedeLabel = "";
        if (ins.sede_nombre) {
          sedeLabel =
            '<span class="sede">Sede: ' + esc(ins.sede_nombre) + "</span>";
        } else if (ins.instancia === "int" && ins.pais) {
          sedeLabel = '<span class="sede">' + esc(ins.pais) + "</span>";
        } else {
          sedeLabel = '<span style="opacity:.5">Sin sede</span>';
        }

        // Categorías (chips)
        const cats = ins.categorias || [];
        const catsHtml = cats.length
          ? '<div class="ins-cats">' +
            cats
              .map((c) => {
                const gClass = c.g === "bachata" ? " bachata" : "";
                const gAbbr =
                  c.g === "bachata" ? "BCH" : c.g === "salsa" ? "SAL" : "";
                const tip = esc((c.n || "") + (c.g ? " · " + c.g : ""));
                return (
                  '<span class="cat-chip' +
                  gClass +
                  '" title="' +
                  tip +
                  '">#' +
                  esc(String(c.c)) +
                  (gAbbr ? ' <span class="g">' + gAbbr + "</span>" : "") +
                  "</span>"
                );
              })
              .join("") +
            "</div>"
          : '<div class="ins-cats"><span style="font-size:11px;color:#E0524C">Sin categoría</span></div>';

        // Botón comprobante (resaltado si lo hay y pago aún pendiente)
        const compBtn = ins.comprobante_url
          ? '<button class="btn-icon attn" onclick="verComprobante(\'' +
            esc(ins.id) +
            '\')" title="Ver comprobante de pago">📎 Comprobante</button>'
          : "";
        const clasifBtn = ins.clasif_url
          ? '<button class="btn-icon attn" onclick="verClasificacion(\'' +
            esc(ins.id) +
            '\')" title="Ver comprobante de clasificación">🏅 Clasificación</button>'
          : "";

        return (
          '<div class="ins-row">' +
          '<div class="ins-col-left">' +
          '<div class="ins-codigo">' +
          esc(cod) +
          "</div>" +
          '<div class="ins-status-row">' +
          musPill +
          recargoPill +
          pagoPill +
          compPill +
          clasifPill +
          "</div>" +
          "</div>" +
          '<div class="ins-col-mid">' +
          '<div class="ins-nombre">' +
          esc(ins.nombre_grupo || ins.nombre || "—") +
          "</div>" +
          '<div class="ins-meta">' +
          esc(inst) +
          '<span class="dot">·</span>' +
          sedeLabel +
          '<span class="dot">·</span>' +
          esc(ins.email || "") +
          (ins.celular ? '<span class="dot">·</span>' + esc(ins.celular) : "") +
          (ins.pais && ins.instancia !== "int"
            ? '<span class="dot">·</span>' + esc(ins.pais)
            : "") +
          (ins.modalidad
            ? '<span class="dot">·</span>' + esc(ins.modalidad)
            : "") +
          "</div>" +
          catsHtml +
          "</div>" +
          '<div class="ins-monto">' +
          esc(monto) +
          "</div>" +
          '<div class="ins-actions">' +
          '<button class="btn-icon" onclick="verIns(\'' +
          esc(ins.id) +
          "')\">↗ Ver</button>" +
          '<button class="btn-icon" onclick="abrirMusica(\'' +
          esc(ins.id) +
          "')\">🎵 Música</button>" +
          compBtn +
          clasifBtn +
          '<button class="btn-icon" onclick="confirmarSenia(\'' +
          esc(ins.id) +
          "')\">½ Seña</button>" +
          '<button class="btn-icon" onclick="confirmarPago(\'' +
          esc(ins.id) +
          "')\">✓ Pago</button>" +
          '<button class="btn-icon" onclick="reenviarMail(\'' +
          esc(ins.id) +
          "')\">✉ Mail</button>" +
          '<button class="btn-icon danger" onclick="eliminarInscripcion(\'' +
          esc(ins.id) +
          "','" +
          esc(cod) +
          "')\">🗑</button>" +
          "</div>" +
          "</div>"
        );
      }

      function verIns(id) {
        window.open("/check?id=" + id, "_blank");
      }

      function verComprobante(id) {
        const ins = allInscriptos.find((x) => x.id === id);
        if (!ins || !ins.comprobante_url) {
          toast("err", "Sin comprobante");
          return;
        }
        mostrarArchivoModal(
          ins.comprobante_url,
          "Comprobante · " +
            getCodigo(ins) +
            " — " +
            (ins.nombre_grupo || ins.nombre || ""),
        );
      }
      // Comprobante de clasificación (Final Nacional): el certificado que
      // acredita haber aprobado en una sede regional. Reusa el mismo modal
      // que el comprobante de pago, antes solo cableado para ese caso.
      function verClasificacion(id) {
        const ins = allInscriptos.find((x) => x.id === id);
        if (!ins || !ins.clasif_url) {
          toast("err", "Sin comprobante de clasificación");
          return;
        }
        mostrarArchivoModal(
          ins.clasif_url,
          "Clasificación · " +
            getCodigo(ins) +
            " — " +
            (ins.nombre_grupo || ins.nombre || ""),
        );
      }
      function mostrarArchivoModal(url, titulo) {
        const ext = (url.split("?")[0].split(".").pop() || "").toLowerCase();
        let viewer = "";
        if (["jpg", "jpeg", "png", "webp", "gif"].includes(ext)) {
          viewer = '<img src="' + esc(url) + '" alt="Archivo">';
        } else if (ext === "pdf") {
          viewer = '<iframe src="' + esc(url) + '"></iframe>';
        } else {
          viewer =
            '<div style="padding:30px;text-align:center;color:rgba(248,245,238,.6)"><p style="margin-bottom:14px">Archivo: <strong>' +
            esc(ext.toUpperCase() || "desconocido") +
            '</strong></p><p style="font-size:12px">Vista previa no disponible. Usá el botón "Descargar" para abrirlo.</p></div>';
        }
        $("compModal").innerHTML =
          '<div class="modal-box" onclick="event.stopPropagation()">' +
          '<div class="modal-head">' +
          "<h3>" +
          esc(titulo) +
          "</h3>" +
          '<button class="modal-close" onclick="closeComp()">✕</button>' +
          "</div>" +
          '<div class="modal-body">' +
          viewer +
          "</div>" +
          '<div class="modal-foot">' +
          '<div class="info">' +
          esc(url) +
          "</div>" +
          '<a class="btn-icon" href="' +
          esc(url) +
          '" target="_blank" rel="noopener">↗ Abrir</a>' +
          '<a class="btn-icon attn" href="' +
          esc(url) +

      // === Música (subida por el director, para participantes que no la cargaron) ===
      const MUS_BUCKET = "musica";
      const MUS_MAX_MB = 50;

      function closeMusica() {
        $("musModal").classList.remove("open");
        $("musModal").innerHTML = "";
      }

      function abrirMusica(id) {
        const ins = allInscriptos.find((x) => x.id === id);
        if (!ins) return;
        const cod = getCodigo(ins);
        const cats =
          Array.isArray(ins.categorias) && ins.categorias.length
            ? ins.categorias
            : null;
        // Muchas inscripciones (schema legacy) no guardan musica_url/musica_estado
        // dentro de cada categoría — solo a nivel de fila. Si ninguna categoría
        // tiene su propio dato, usamos el de la fila como referencia.
        const anyCatHasOwnMusic = cats
          ? cats.some((c) => c && c.musica_url)
          : false;
        const rowsHtml = cats
          ? cats
              .map((c, idx) => renderMusicaRow(ins, c, idx, anyCatHasOwnMusic))
              .join("")
          : renderMusicaRow(ins, null, -1, false);
        $("musModal").innerHTML =
          '<div class="modal-box" onclick="event.stopPropagation()">' +
          '<div class="modal-head"><h3>Música · ' +
          esc(cod) +
          " — " +
          esc(ins.nombre_grupo || ins.nombre || "") +
          "</h3>" +
          '<button class="modal-close" onclick="closeMusica()">✕</button>' +
          "</div>" +
          '<div class="modal-body" style="align-items:stretch;justify-content:flex-start">' +
          rowsHtml +
          "</div>" +
          "</div>";
        $("musModal").classList.add("open");
      }

      function renderMusicaRow(ins, cat, idx, anyCatHasOwnMusic) {
        const slot = ins.id + "__" + idx;
        const label = cat
          ? "#" +
            esc(String(cat.c)) +
            (cat.n ? " — " + esc(cat.n) : "") +
            (cat.g ? " (" + esc(cat.g) + ")" : "")
          : "Música";

        // La categoría tiene su propia canción cargada explícitamente.
        const ownUrl = cat && cat.musica_url;
        // Fallback legacy: ninguna categoría de esta inscripción tiene dato propio,
        // pero la fila sí tiene una canción cargada (schema viejo, pre-multicategoría).
        const legacyFallback =
          !ownUrl &&
          !anyCatHasOwnMusic &&
          ins.musica_estado === "cargada" &&
          ins.musica_url;

        const cargada = !!(ownUrl || legacyFallback);
        const effUrl = ownUrl ? cat.musica_url : legacyFallback ? ins.musica_url : null;
        const effNombre = ownUrl
          ? cat.musica_nombre
          : legacyFallback
            ? ins.musica_nombre
            : null;

        const statusHtml = cargada
          ? '<span class="status-pill ok"><span class="ico">✓</span>Cargada</span>'
          : '<span class="status-pill pend"><span class="ico">⏳</span>Pendiente</span>';
        const audioHtml = cargada
          ? '<audio class="mus-audio" controls src="' +
            esc(effUrl) +
            '"></audio><div class="ins-meta" style="margin-bottom:10px">' +
            esc(effNombre || "") +
            "</div>" +
            (legacyFallback
              ? '<div class="mus-empty">Canción registrada a nivel de inscripción (no vinculada a esta categoría en particular).</div>'
              : "")
          : '<div class="mus-empty">El participante no subió canción.</div>';
        const btnLabel = cargada ? "🎵 Reemplazar archivo" : "🎵 Elegir archivo";
        return (
          '<div class="mus-row">' +
          '<div class="mus-row-head"><div class="ins-nombre" style="font-size:15px">' +
          label +
          "</div>" +
          statusHtml +
          "</div>" +
          audioHtml +
          '<button class="btn-icon" onclick="document.getElementById(\'musFile-' +
          slot +
          "').click()\">" +
          btnLabel +
          "</button>" +
          '<input type="file" accept="audio/*" id="musFile-' +
          slot +
          '" style="display:none" onchange="onMusicaPicked(\'' +
          esc(ins.id) +
          "','" +
          idx +
          "', this)\">" +
          '<div id="musProg-' +
          slot +
          '"></div>' +
          '<div id="musMsg-' +
          slot +
          '" class="mus-msg"></div>' +
          "</div>"
        );
      }

      function onMusicaPicked(insId, idxStr, inputEl) {
        const file = inputEl.files[0];
        if (!file) return;
        const slot = insId + "__" + idxStr;
        const msgBox = $("musMsg-" + slot);
        const mb = file.size / (1024 * 1024);
        if (mb > MUS_MAX_MB) {
          if (msgBox)
            msgBox.innerHTML =
              '<span style="color:#e0524c">El archivo supera ' +
              MUS_MAX_MB +
              " MB (" +
              mb.toFixed(1) +
              " MB).</span>";
          inputEl.value = "";
          return;
        }
        if (msgBox) msgBox.innerHTML = "";
        uploadMusicaAdmin(insId, Number(idxStr), file);
      }

      async function uploadMusicaAdmin(insId, idx, file) {
        const ins = allInscriptos.find((x) => x.id === insId);
        if (!ins) return;
        const slot = insId + "__" + idx;
        const progBox = $("musProg-" + slot);
        const msgBox = $("musMsg-" + slot);
        if (progBox)
          progBox.innerHTML =
            '<div class="mus-progress"><div class="bar" id="musBar-' +
            slot +
            '"></div></div><div class="mus-pct" id="musPct-' +
            slot +
            '">0%</div>';
        if (msgBox) msgBox.innerHTML = "";

        try {
          const ext = (file.name.split(".").pop() || "mp3").toLowerCase();
          const safeCod = getCodigo(ins).replace(/[^A-Za-z0-9\-]/g, "");
          const path = safeCod + "-" + Date.now() + "." + ext;

          const publicUrl = await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open(
              "POST",
              SB_URL +
                "/storage/v1/object/" +
                MUS_BUCKET +
                "/" +
                encodeURIComponent(path),
            );
            xhr.setRequestHeader("apikey", SB_ANON);
            xhr.setRequestHeader("Authorization", "Bearer " + SB_ANON);
            xhr.setRequestHeader(
              "Content-Type",
              file.type || "application/octet-stream",
            );
            xhr.setRequestHeader("x-upsert", "true");
            xhr.upload.onprogress = (e) => {
              if (e.lengthComputable) {
                const pct = Math.round((e.loaded * 100) / e.total);
                const bar = $("musBar-" + slot);
                if (bar) bar.style.width = pct + "%";
                const txt = $("musPct-" + slot);
                if (txt) txt.textContent = pct + "%";
              }
            };
            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve(
                  SB_URL +
                    "/storage/v1/object/public/" +
                    MUS_BUCKET +
                    "/" +
                    path,
                );
              } else {
                reject(
                  new Error(
                    "Upload falló: HTTP " +
                      xhr.status +
                      " " +
                      xhr.responseText.substring(0, 200),
                  ),
                );
              }
            };
            xhr.onerror = () => reject(new Error("Error de red durante upload"));
            xhr.send(file);
          });

          let patchBody, categorias = null, catCode = null;
          if (idx >= 0 && Array.isArray(ins.categorias) && ins.categorias[idx]) {
            categorias = ins.categorias.slice();
            categorias[idx] = Object.assign({}, categorias[idx], {
              musica_url: publicUrl,
              musica_nombre: file.name,
              musica_estado: "cargada",
            });
            catCode = categorias[idx].c;
            const catsConMusica = categorias.filter(
              (c) => c && c.musica_estado === "cargada",
            );
            const primera = catsConMusica[0] || null;
            patchBody = {
              categorias: categorias,
              musica_url: primera ? primera.musica_url : null,
              musica_nombre: primera ? primera.musica_nombre : null,
              musica_estado:
                categorias.length > 0 &&
                catsConMusica.length === categorias.length
                  ? "cargada"
                  : "pendiente",
            };
          } else {
            patchBody = {
              musica_url: publicUrl,
              musica_nombre: file.name,
              musica_estado: "cargada",
            };
          }

          const patchRes = await fetch(
            SB_URL + "/rest/v1/inscripciones?id=eq." + insId,
            {
              method: "PATCH",
              headers: {
                apikey: SB_ANON,
                Authorization: "Bearer " + SB_ANON,
                "Content-Type": "application/json",
                Prefer: "return=representation",
              },
              body: JSON.stringify(patchBody),
            },
          );
          if (!patchRes.ok) {
            const errTxt = await patchRes.text();
            throw new Error(
              "No se pudo guardar (HTTP " +
                patchRes.status +
                "): " +
                errTxt.substring(0, 200),
            );
          }
          const verify = await patchRes.json();
          const verifyRow = verify && verify[0];
          const verifyOk = categorias
            ? verifyRow &&
              Array.isArray(verifyRow.categorias) &&
              verifyRow.categorias.some(
                (c) =>
                  c && String(c.c) === String(catCode) && c.musica_url === publicUrl,
              )
            : verifyRow && verifyRow.musica_url === publicUrl;
          if (!verifyOk)
            throw new Error(
              "Se subió pero no se confirmó la asociación. Reintentá.",
            );

          if (categorias) ins.categorias = verifyRow.categorias;
          ins.musica_url = verifyRow.musica_url;
          ins.musica_nombre = verifyRow.musica_nombre;
          ins.musica_estado = verifyRow.musica_estado;

          updateStats();
          drawList();
          abrirMusica(insId);
          toast("ok", "Música cargada ✓");
        } catch (e) {
          if (progBox) progBox.innerHTML = "";
          if (msgBox)
            msgBox.innerHTML =
              '<span style="color:#e0524c">' + esc(e.message) + "</span>";
          toast("err", "Error: " + e.message);
        }
      }
      async function confirmarPago(id) {

      async function reenviarMail(id) {

          // el nivel superior. Este catch leía d.error (que en ese caso no

          // motivo real.

      async function eliminarInscripcion(id, codigo) {
        const c = prompt("Para eliminar " + codigo + " escribí: BORRAR");
        if (c !== "BORRAR") {
          toast("err", "Cancelado");
          return;
        }
        try {
          // scoring.sesiones/puntajes se unen a la inscripción solo por
          // codigo_id (texto, sin foreign key) — sin borrarlas acá quedan
          // huérfanas, y si ese código se reutiliza más adelante sus
          // puntajes viejos pueden resurgir mezclados con el participante
          // nuevo (mismo tipo de problema que fix-codigo-id-atomico.sql
          // documentó para códigos duplicados).
          if (codigo && codigo !== "JAM-???") {
            try {
              await fetch(
                SB_URL +
                  "/rest/v1/sesiones?codigo_id=eq." +
                  encodeURIComponent(codigo),
                {
                  method: "DELETE",
                  headers: {
                    apikey: SB_ANON,
                    Authorization: "Bearer " + SB_ANON,
                    "Content-Profile": "scoring",
                  },
                },
              );
            } catch (e) {
              console.warn("No se pudieron borrar sesiones de scoring:", e);
            }
          }
          const r = await fetch(SB_URL + "/rest/v1/inscripciones?id=eq." + id, {
            method: "DELETE",
            headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON },
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          allInscriptos = allInscriptos.filter((x) => x.id !== id);
          await computeAllCodes();
          updateStats();
          renderActiveTab();
          toast("ok", "Inscripción " + codigo + " eliminada ✓");
        } catch (e) {
          toast("err", "Error: " + e.message);
        }
      }
      async function resetAll() {
        const c1 = prompt(
          "⚠️ Elimina TODAS las inscripciones + archivos. Confirmar escribiendo: BORRAR TODO",
        );
        if (c1 !== "BORRAR TODO") {
          toast("err", "Cancelado");
          return;
        }
        if (!confirm("ÚLTIMA CONFIRMACIÓN: ¿Borrar todo?")) return;
        try {
          const r = await fetch(
            SB_URL + "/rest/v1/inscripciones?created_at=lt.2099-01-01",
            {
              method: "DELETE",
              headers: {
                apikey: SB_ANON,
                Authorization: "Bearer " + SB_ANON,
                Prefer: "return=representation",
              },
            },
          );
          const del = await r.json();
          const n = Array.isArray(del) ? del.length : 0;
          async function clean(b) {
            const rl = await fetch(SB_URL + "/storage/v1/object/list/" + b, {
              method: "POST",
              headers: {
                apikey: SB_ANON,
                Authorization: "Bearer " + SB_ANON,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                limit: 500,
                offset: 0,
                prefix: "",
                sortBy: { column: "name", order: "asc" },
              }),
            });
            const fs = await rl.json();
            if (!Array.isArray(fs) || !fs.length) return 0;
            const rd = await fetch(SB_URL + "/storage/v1/object/" + b, {
              method: "DELETE",
              headers: {
                apikey: SB_ANON,
                Authorization: "Bearer " + SB_ANON,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ prefixes: fs.map((f) => f.name) }),
            });
            return rd.ok ? fs.length : 0;
          }
          const m = await clean("musica");
          const c = await clean("comprobantes");
          allInscriptos = [];
          await computeAllCodes();
          updateStats();
          renderActiveTab();
          toast(
            "ok",
            "Reset OK: " +
              n +
              " inscripciones + " +
              m +
              " músicas + " +
              c +
              " comprobantes",
          );
        } catch (e) {
          toast("err", "Error: " + e.message);
        }
      }
      // Antes esto exportaba un .csv de texto — al abrirlo con doble clic,
      // Excel en configuración regional Argentina (donde la coma es el
      // separador decimal) muchas veces no separa las columnas solo, y
      // los clientes no sabían cómo delimitarlo a mano. Ahora genera un
      // .xlsx real (misma librería que ya usa /competencia para sus
      // exportaciones), que abre con las columnas ya armadas.
      function exportExcel() {
        if (typeof XLSX === "undefined") {
          toast("err", "Librería Excel no cargada, recargá la página");
          return;
        }
        const filtered = allInscriptos.filter(matchesFilters);
        const data = filtered.length ? filtered : allInscriptos;
        const rows = data.map((ins) => {
          const catsTxt = (ins.categorias || [])
            .map((c) => "#" + c.c + (c.g ? "/" + c.g : ""))
            .join(" ");
          const integrantesArr = Array.isArray(ins.integrantes)
            ? ins.integrantes
            : [];
          const cantIntegrantes =
            Number(ins.cant_personas) || integrantesArr.length || 1;
          const nombresIntegrantes = integrantesArr
            .map((i) => i.nombre || "")
            .filter(Boolean)
            .join("; ");
          return {
            Codigo: getCodigo(ins),
            Instancia: INSTANCIAS[ins.instancia]?.label || ins.instancia,
            Sede: ins.sede_nombre || "",
            Pais: ins.pais || "",
            Nombre: ins.nombre || "",
            Grupo: ins.nombre_grupo || "",
            Email: ins.email || "",
            Celular: ins.celular || "",
            Modalidad: ins.modalidad || "",
            CantIntegrantes: cantIntegrantes,
            Integrantes: nombresIntegrantes,
            Categorias: catsTxt,
            Monto: Number(ins.monto_total || 0),
            Moneda: ins.moneda || "",
            Pago: ins.pago_estado || "",
            Musica: ins.musica_estado || "",
            RecargoMusica: ins.musica_fuera_termino ? "sí" : "no",
            Comprobante: ins.comprobante_url ? "sí" : "no",
            Fecha: ins.created_at
              ? new Date(ins.created_at).toLocaleString("es-AR")
              : "",
          };
        });
        try {
          const ws = XLSX.utils.json_to_sheet(rows);
          ws["!cols"] = [
            { wch: 16 }, { wch: 12 }, { wch: 18 }, { wch: 14 },
            { wch: 25 }, { wch: 25 }, { wch: 28 }, { wch: 16 },
            { wch: 12 }, { wch: 14 }, { wch: 40 }, { wch: 30 },
            { wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 12 },
            { wch: 14 }, { wch: 14 }, { wch: 18 },
          ];
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Inscriptos");
          const fecha = new Date().toISOString().substring(0, 10);
          XLSX.writeFile(wb, "inscriptos-jam-" + fecha + ".xlsx");
          toast("ok", "Excel exportado (" + data.length + " filas) ✓");
        } catch (e) {
          toast("err", "Error: " + e.message);
        }
      }

      // === Sedes regionales (agregar, editar, borrar, habilitar/deshabilitar) ===
      // Fuente de verdad: evento.config, clave "sedes_lista" — index.html
      // lee esta misma clave al cargar la página de inscripción y arma el
      // <select> de sedes con eso. Antes esta lista estaba hardcodeada en
      // el código (solo yo podía tocarla); ahora se administra entera
      // desde acá.
      var SEDES_ADMIN = [];
      var SEDES_ADMIN_SEQ = 0;
      var MESES_ABR_SEDES = { ene:0, feb:1, mar:2, abr:3, may:4, jun:5, jul:6, ago:7, sep:8, oct:9, nov:10, dic:11 };
      var MESES_LARGOS_SEDES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      // El campo de fecha es texto libre ("13 Ago") — si no respeta el
      // formato (número + espacio + primeras 3 letras del mes en español),
      // no tira error: esa sede simplemente nunca se cierra sola por
      // fecha, en silencio. sedeFechaHintTexto() existe para que eso se
      // vea en el panel en vez de pasar desapercibido.
      function parseFechaSedeAdmin(fecha) {
        var m = String(fecha || "").trim().match(/^(\d{1,2})\s+([A-Za-zÀ-ÿ]{3})/);
        if (!m) return null;
        var dia = parseInt(m[1], 10), mes = MESES_ABR_SEDES[m[2].toLowerCase()];
        if (mes == null || isNaN(dia)) return null;
        return new Date(2026, mes, dia);
      }
      function sedeAdminVencida(fecha) {
        var d = parseFechaSedeAdmin(fecha);
        if (!d) return false;
        var hoy = new Date();
        var hoySolo = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
        return hoySolo > d;
      }
      function sedeFechaHintTexto(fecha) {
        if (!String(fecha || '').trim()) return '';
        var d = parseFechaSedeAdmin(fecha);
        if (!d) {
          return '⚠ No reconozco ese formato (probá "13 Ago") — esta sede nunca se va a cerrar sola por fecha.';
        }
        var cierre = new Date(d.getTime());
        cierre.setDate(cierre.getDate() + 1);
        return '✓ Se cierra sola a partir del ' + cierre.getDate() + ' de ' + MESES_LARGOS_SEDES[cierre.getMonth()] + '.';
      }
      function sedeFechaHintUpdate(inputEl) {
        var hint = inputEl.parentElement && inputEl.parentElement.querySelector('.sede-fecha-hint');
        if (!hint) return;
        var v = inputEl.value;
        hint.style.color = !v.trim()
          ? 'rgba(248,245,238,.4)'
          : (parseFechaSedeAdmin(v) ? '#4CAF7D' : '#E0524C');
        hint.textContent = sedeFechaHintTexto(v);
      }
      function slugifySede(n) {
        var s = (n || "").toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        return s || 'sede';
      }
      function idSedeUnico(base, existentes) {
        var id = base, n = 2;
        while (existentes.indexOf(id) !== -1) { id = base + '-' + n; n++; }
        return id;
      }
      function sedeSelStyle() {
        return 'background:#0e0e0e;border:1px solid #333;border-radius:6px;color:#F8F5EE;padding:7px 9px;font-family:inherit;font-size:12px';
      }
      function sedeInputHtml(field, placeholder, value) {
        return '<input data-field="' + field + '" placeholder="' + esc(placeholder) + '" value="' + esc(value || '') + '" style="width:100%;padding:9px;background:#0e0e0e;border:1px solid #333;border-radius:6px;color:#F8F5EE;font-family:inherit;font-size:12px">';
      }

      function renderSedes() {

        if (!cont) return;
        cont.innerHTML =

          '<div style="font-size:12px;color:rgba(248,245,238,.55);margin-bottom:10px;line-height:1.5">Solo afecta la inscripción a <strong>Sedes</strong> (el selector que ve la gente). Cada sede se cierra sola al día siguiente de su fecha, salvo que la fuerces con "Estado". Borrar o editar una sede acá <strong>no</strong> toca las inscripciones que ya se hicieron (guardan el nombre de sede tal cual estaba en su momento) — solo cambia lo que aparece de acá en adelante. En Nacional y Repesca las sedes siempre aparecen todas (ahí solo se declara de dónde clasificaste).</div>' +
          '<div id="sedes-rows"><div style="font-size:12px;color:rgba(248,245,238,.4);padding:8px 0">Cargando…</div></div>' +
          '<button onclick="sedesAgregar()" style="background:transparent;color:#C9A84C;border:1px dashed #C9A84C;padding:10px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;width:100%;margin-top:8px">+ Agregar sede</button>' +
          '<button onclick="sedesGuardar()" style="background:#4CAF7D;color:#0a0a0a;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;width:100%;margin-top:8px">💾 Guardar cambios</button>' +
          '<div id="sedes-msg" style="font-size:12px;text-align:center;min-height:16px;margin-top:8px"></div>' +

      async function sedesCargar() {
        try {
          var r = await fetch(SB_URL + '/rest/v1/config?clave=eq.sedes_lista&select=valor_json', {
            headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Accept-Profile': 'evento' }
          });
          var d = await r.json();
          var lista = (d && d[0] && d[0].valor_json) || [];
          SEDES_ADMIN = lista.map(function (s) {
            SEDES_ADMIN_SEQ++;
            return {
              _key: 'k' + SEDES_ADMIN_SEQ,
              id: s.id || null,

              fecha: s.fecha || '',

              org: s.org || '',
              email: s.email || '',

          SEDES_ADMIN = [];

        sedesRenderRows();

      function sedesRenderRows() {
        var rowsCont = document.getElementById('sedes-rows');
        if (!rowsCont) return;
        if (!SEDES_ADMIN.length) {
          rowsCont.innerHTML = '<div style="font-size:12px;color:rgba(248,245,238,.4);padding:8px 0">No hay sedes cargadas. Usá "+ Agregar sede".</div>';
          return;

        rowsCont.innerHTML = SEDES_ADMIN.map(function (s) {
          var vencidaTxt = sedeAdminVencida(s.fecha) ? ' (cerrada por fecha)' : ' (abierta por fecha)';
          var fechaHintColor = !String(s.fecha || '').trim()
            ? 'rgba(248,245,238,.4)'
            : (parseFechaSedeAdmin(s.fecha) ? '#4CAF7D' : '#E0524C');
          return (
            '<div data-key="' + s._key + '" style="border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px">' +
            '<div style="display:grid;grid-template-columns:1fr 130px;gap:8px;margin-bottom:2px">' +
            sedeInputHtml('n', 'Nombre de la sede', s.n) +
            '<div>' +
            '<input data-field="fecha" placeholder="Fecha (ej: 23 Ago)" value="' + esc(s.fecha || '') + '" oninput="sedeFechaHintUpdate(this)" style="width:100%;padding:9px;background:#0e0e0e;border:1px solid #333;border-radius:6px;color:#F8F5EE;font-family:inherit;font-size:12px">' +
            '<div class="sede-fecha-hint" style="font-size:10.5px;margin-top:4px;line-height:1.4;color:' + fechaHintColor + '">' + esc(sedeFechaHintTexto(s.fecha)) + '</div>' +
            '</div>' +
            '</div>' +
            '<div style="height:8px"></div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">' +
            sedeInputHtml('org', 'Organizador', s.org) +
            sedeInputHtml('email', 'Email organizador', s.email) +
            '</div>' +
            '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
            '<select data-field="tipo" style="' + sedeSelStyle() + '">' +
            '<option value="p"' + (s.tipo !== 'v' ? ' selected' : '') + '>Presencial</option>' +
            '<option value="v"' + (s.tipo === 'v' ? ' selected' : '') + '>Virtual</option>' +
            '</select>' +
            '<select data-field="estado" style="' + sedeSelStyle() + '">' +
            '<option value="auto"' + (s.estado !== 'on' && s.estado !== 'off' ? ' selected' : '') + '>Automático' + vencidaTxt + '</option>' +
            '<option value="on"' + (s.estado === 'on' ? ' selected' : '') + '>Forzar habilitada</option>' +
            '<option value="off"' + (s.estado === 'off' ? ' selected' : '') + '>Forzar deshabilitada</option>' +
            '</select>' +
            '<button onclick="sedesEliminar(\'' + s._key + '\')" style="margin-left:auto;background:transparent;color:#E0524C;border:1px solid rgba(224,82,82,.4);border-radius:6px;padding:7px 10px;font-size:12px;cursor:pointer;font-family:inherit">🗑 Borrar</button>' +
            '</div>' +
            '</div>'
          );
        }).join('');
      }

      function sedesAgregar() {
        SEDES_ADMIN_SEQ++;
        SEDES_ADMIN.push({ _key: 'k' + SEDES_ADMIN_SEQ, id: null, n: '', fecha: '', tipo: 'p', org: '', email: '', estado: 'auto' });
        sedesRenderRows();
        var rows = document.querySelectorAll('#sedes-rows [data-key]');
        var last = rows[rows.length - 1];
        var inp = last && last.querySelector('input[data-field="n"]');
        if (inp) inp.focus();
      }

      function sedesEliminar(key) {
        SEDES_ADMIN = SEDES_ADMIN.filter(function (s) { return s._key !== key; });
        sedesRenderRows();
      }

      async function sedesGuardar() {
        var msg = document.getElementById('sedes-msg');
        var rowEls = document.querySelectorAll('#sedes-rows [data-key]');
        var idsExistentes = SEDES_ADMIN.filter(function (s) { return s.id; }).map(function (s) { return s.id; });
        var payload = [];
        var error = null;
        rowEls.forEach(function (rowEl) {
          if (error) return;
          var key = rowEl.getAttribute('data-key');
          var original = SEDES_ADMIN.find(function (s) { return s._key === key; });
          var n = (rowEl.querySelector('input[data-field="n"]').value || '').trim();
          var fecha = (rowEl.querySelector('input[data-field="fecha"]').value || '').trim();
          var org = (rowEl.querySelector('input[data-field="org"]').value || '').trim();
          var email = (rowEl.querySelector('input[data-field="email"]').value || '').trim();
          var tipo = rowEl.querySelector('select[data-field="tipo"]').value;
          var estado = rowEl.querySelector('select[data-field="estado"]').value;
          if (!n) { error = 'Falta el nombre de una sede'; return; }
          if (!fecha) { error = 'Falta la fecha de "' + n + '"'; return; }
          var id = original && original.id;
          if (!id) {
            id = idSedeUnico(slugifySede(n), idsExistentes);
            idsExistentes.push(id);
          }
          payload.push({ id: id, n: n, fecha: fecha, tipo: tipo, org: org, email: email, estado: estado });
        });
        if (error) {
          if (msg) { msg.style.color = '#E0524C'; msg.textContent = error; }
          return;
        }
        if (msg) { msg.style.color = '#888'; msg.textContent = 'Guardando…'; }
        try {
          var r = await fetch(SB_URL + '/rest/v1/rpc/actualizar_config', {
            method: 'POST',
            headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_clave: 'sedes_lista', p_valor_json: payload })
          });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          if (msg) { msg.style.color = '#4CAF7D'; msg.textContent = '✓ Sedes guardadas. Ya impactan en la inscripción.'; }
          sedesCargar();
        } catch (e) {
          if (msg) { msg.style.color = '#E0524C'; msg.textContent = 'Error: ' + e.message; }
        }
      }

            method: "POST",

            body: "{}",
          });
          const d = await r.json();
          if (!Array.isArray(d)) return;
          const map = {};
          d.forEach((c) => (map[c.clave] = c.valor));
          if (map.nombre_madre) SYS_NOMBRE_MADRE = map.nombre_madre;
          const setV = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
          setV("sys-edicion", map.edicion);
          setV("sys-fecha", map.fecha_evento);
          setV("sys-lugar", map.lugar_evento);
          sysPreview();
        } catch (e) {}
      }

      async function sysGuardarIdentidad() {
        const msg = document.getElementById("sys-msg");
        const getV = (id) => (document.getElementById(id)?.value || "").trim();
        const edicion = getV("sys-edicion");
        const fecha = getV("sys-fecha");
        const lugar = getV("sys-lugar");
        const nombreEvento = (SYS_NOMBRE_MADRE + " " + edicion).trim();
        if (msg) { msg.style.color = "#888"; msg.textContent = "Guardando\u2026"; }
        async function guardar(clave, valor) {
          const r = await fetch(SB_URL + "/rest/v1/rpc/actualizar_config", {
            method: "POST",
            headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON, "Content-Type": "application/json" },
            body: JSON.stringify({ p_clave: clave, p_valor: valor }),
          });
          if (!r.ok) throw new Error("no se pudo guardar " + clave);
        }
        try {
          await guardar("edicion", edicion);
          await guardar("nombre_evento", nombreEvento);
          await guardar("fecha_evento", fecha);
          await guardar("lugar_evento", lugar);
          if (msg) { msg.style.color = "#4CAF7D"; msg.textContent = "\u2713 Guardado. Los portales y la web reflejan " + nombreEvento; }
        } catch (e) {
          if (msg) { msg.style.color = "#E0524C"; msg.textContent = "Error: " + e.message; }
        }
      }
      async function loadPrecios() {
        try {
          const r = await fetch(
            SB_URL + "/rest/v1/config_precios?id=eq.1&select=*",
            {
              headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON },
            },
          );
          const d = await r.json();
          preciosConfig = d[0]?.config || null;
          return preciosConfig;
        } catch (e) {
          toast("err", "Error: " + e.message);
          return null;
        }
      }
      function getCategoriaExtraActual(extras) {
        if (!extras) return { value: 0, periodo: "—" };
        const m = new Date().getMonth() + 1;
        if (m >= 4 && m <= 5)
          return { value: extras.abril_mayo || 0, periodo: "Abril–Mayo" };
        if (m >= 6 && m <= 7)
          return { value: extras.junio_julio || 0, periodo: "Junio–Julio" };
        if (m >= 8 && m <= 9)
          return {
            value: extras.agosto_septiembre || 0,
            periodo: "Agosto–Septiembre",
          };
        return { value: 0, periodo: "Fuera de temporada" };
      }
      async function renderPrecios() {
        var box = $("pane-precios");
        if (!box) return;
        box.innerHTML =
          '<div style="padding:20px;text-align:center;color:#888">Cargando precios…</div>';

        fetch(SB_URL + "/rest/v1/config_precios?id=eq.1&select=config", {
          headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON },
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var P = (d && d[0] && d[0].config) || {};
            var N = P.nacional || {};
            var I = P.internacional || {};

            function input(id, val, suffix) {
              var v = val != null ? val : "";
              return (
                '<div style="margin-bottom:10px"><label style="display:block;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">' +
                id
                  .replace(/_/g, " ")
                  .replace(/ars/i, "(ARS)")
                  .replace(/usd/i, "(USD)") +
                '</label><input id="p_' +
                id +
                '" type="number" value="' +
                v +
                '" style="width:100%;padding:10px 12px;background:#0e0e0e;color:#F8F5EE;border:1px solid rgba(201,168,76,.3);border-radius:8px;font-size:14px;font-family:\'JetBrains Mono\',monospace"></div>'
              );
            }

            function section(title, html) {
              return (
                '<div style="background:#141414;border:1px solid rgba(201,168,76,.2);border-radius:14px;padding:18px;margin-bottom:16px">' +
                '<div style="font-size:12px;color:#C9A84C;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid rgba(201,168,76,.15)">' +
                title +
                "</div>" +
                html +
                "</div>"
              );
            }

            var sedesH =
              input("sedes_solista_ars", N.sedes_solista_ars) +
              input("sedes_grupo_ars", N.sedes_grupo_ars) +
              input("sedes_extra_categoria_ars", N.sedes_extra_categoria_ars);

            var repH =
              input("repesca_solista_ars", N.repesca_solista_ars) +
              input("repesca_grupo_ars", N.repesca_grupo_ars) +
              input(
                "repesca_extra_categoria_ars",
                N.repesca_extra_categoria_ars,
              );

            var finalH =
              input("final_solista_ars", N.final_solista_ars) +
              input("final_grupo_ars", N.final_grupo_ars) +
              input("final_extra_categoria_ars", N.final_extra_categoria_ars);

            var interH =
              input("solista_usd", I.solista_usd) +
              input("grupo_usd", I.grupo_usd) +
              input("extra_categoria_usd", I.extra_categoria_usd);

            var helpH =
              '<div style="background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:14px;margin-bottom:16px;font-size:12px;color:#E8A838;line-height:1.6">' +
              '<strong style="color:#C9A84C">Cómo se calcula:</strong><br>' +
              "• Modalidad solista 1 categoría → cobra base solista<br>" +
              "• Modalidad solista N categorías → base solista + (N-1) × extra por categoría<br>" +
              "• Modalidad grupo 1 categoría → cobra base grupo<br>" +
              "• Modalidad grupo N categorías → base grupo + (N-1) × extra por categoría" +
              "</div>";

            var btnH =
              '<div style="display:flex;gap:10px;margin-top:8px">' +
              '<button onclick="savePrecios()" style="flex:1;padding:14px 24px;background:#C9A84C;color:#0A0A0A;border:none;border-radius:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-size:14px">💾 Guardar precios</button>' +
              '<button onclick="renderPrecios()" style="padding:14px 24px;background:transparent;color:#C9A84C;border:1px solid #C9A84C;border-radius:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-size:14px">↻ Recargar</button>' +
              "</div>";

            box.innerHTML =
              helpH +
              section("💵 Inter América (USD)", interH) +
              section(
                '<svg width="16" height="11" viewBox="0 0 16 11" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;border-radius:2px"><rect width="16" height="3.67" fill="#74ACDF"/><rect width="16" height="3.67" y="3.67" fill="#fff"/><rect width="16" height="3.67" y="7.33" fill="#74ACDF"/><circle cx="8" cy="5.5" r="1.6" fill="#F6B40E"/></svg> Sedes — Final Regional (ARS)',
                sedesH
              ) +
              section("🔄 Repechaje (ARS)", repH) +
              section("🏆 Final Nacional (ARS)", finalH) +
              btnH +
              '<div id="precios-msg" style="margin-top:14px;text-align:center"></div>';
          })
          .catch(function (e) {
            box.innerHTML =
              '<div style="background:rgba(224,82,76,.1);border:1px solid #E0524C;color:#E0524C;padding:14px;border-radius:10px">Error cargando precios: ' +
              e.message +
              "</div>";
          });
      }

      function savePrecios() {
        function num(id) {
          var el = document.getElementById("p_" + id);
          var v = Number(el && el.value);
          return isFinite(v) && v >= 0 ? v : 0;
        }
        var newCfg = {
          nacional: {
            sedes_solista_ars: num("sedes_solista_ars"),
            sedes_grupo_ars: num("sedes_grupo_ars"),
            sedes_extra_categoria_ars: num("sedes_extra_categoria_ars"),
            repesca_solista_ars: num("repesca_solista_ars"),
            repesca_grupo_ars: num("repesca_grupo_ars"),
            repesca_extra_categoria_ars: num("repesca_extra_categoria_ars"),
            final_solista_ars: num("final_solista_ars"),
            final_grupo_ars: num("final_grupo_ars"),
            final_extra_categoria_ars: num("final_extra_categoria_ars"),
          },
          internacional: {
            solista_usd: num("solista_usd"),
            grupo_usd: num("grupo_usd"),
            extra_categoria_usd: num("extra_categoria_usd"),
          },
        };
        var msg = $("precios-msg");
        if (msg)
          msg.innerHTML = '<span style="color:#E8A838">⏳ Guardando…</span>';

        fetch(SB_URL + "/rest/v1/config_precios?id=eq.1", {
          method: "PATCH",
          headers: {
            apikey: SB_ANON,
            Authorization: "Bearer " + SB_ANON,
            "Content-Type": "application/json",
            Prefer: "return=representation",
          },
          body: JSON.stringify({
            config: newCfg,
            updated_at: new Date().toISOString(),
          }),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (d) {
            if (msg)
              msg.innerHTML =
                '<span style="color:#4CAF7D">✓ Precios guardados — los cambios se aplican a las próximas inscripciones</span>';
            setTimeout(function () {
              if (msg) msg.innerHTML = "";
            }, 5000);
          })
          .catch(function (e) {
            if (msg)
              msg.innerHTML =
                '<span style="color:#E0524C">✗ Error: ' + e.message + "</span>";
          });
      }
    </script>
  </body>
</html>
