<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin — JAM 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#080808;color:#F8F5EE;min-height:100vh}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.login h1{font-family:'Cormorant Garamond',serif;font-size:64px;color:#C9A84C;letter-spacing:8px;font-weight:700}
.login p{color:rgba(248,245,238,.6);font-size:13px;text-transform:uppercase;letter-spacing:2px;margin:8px 0 28px}
.login input{background:#141414;border:1px solid #2a2a2a;color:#F8F5EE;padding:14px 18px;border-radius:10px;width:280px;font-size:15px;margin-bottom:14px;text-align:center;font-family:inherit}
.login input:focus{outline:none;border-color:#C9A84C}
.login button{background:#C9A84C;color:#0A0A0A;border:none;padding:13px 38px;border-radius:10px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.app{display:none;max-width:1400px;margin:0 auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #2a2a2a;margin-bottom:20px}
.topbar h1{font-family:'Cormorant Garamond',serif;font-size:34px;color:#C9A84C;letter-spacing:4px;font-weight:700}
.subtitle{font-size:11px;color:rgba(248,245,238,.5);text-transform:uppercase;letter-spacing:2px}
.logout{background:transparent;border:1px solid rgba(248,245,238,.2);color:rgba(248,245,238,.7);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:18px}
.stat.gold{border-left:3px solid #C9A84C}
.stat.green{border-left:3px solid #4CAF7D}
.stat.amber{border-left:3px solid #E8A838}
.stat-label{font-size:11px;color:rgba(248,245,238,.5);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:28px;color:#F8F5EE;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid #2a2a2a;flex-wrap:wrap}
.tab{padding:11px 18px;cursor:pointer;color:rgba(248,245,238,.6);font-size:13px;border-bottom:2px solid transparent}
.tab.active{color:#C9A84C;border-color:#C9A84C}
.tab-pane{display:none}
.tab-pane.active{display:block}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-box{background:#141414;border:1px solid #2a2a2a;color:#F8F5EE;padding:10px 14px;border-radius:8px;font-family:inherit;font-size:13px;flex:1;min-width:200px}
.search-box:focus{outline:none;border-color:#C9A84C}
.btn-primary{background:#C9A84C;color:#0A0A0A;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.btn-secondary{background:transparent;border:1px solid rgba(248,245,238,.2);color:rgba(248,245,238,.8);padding:9px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px}
.ins-row{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center}
.ins-row:hover{border-color:#C9A84C}
.ins-codigo{font-family:'JetBrains Mono',monospace;color:#C9A84C;font-weight:600;font-size:13px}
.ins-nombre{font-family:'Cormorant Garamond',serif;font-size:18px;color:#F8F5EE;font-weight:600}
.ins-meta{font-size:11px;color:rgba(248,245,238,.5);margin-top:3px}
.ins-monto{font-family:'JetBrains Mono',monospace;color:#F8F5EE;font-weight:600;font-size:14px}
.ins-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn-icon{background:transparent;border:1px solid rgba(201,168,76,.3);color:#C9A84C;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px}
.btn-icon:hover{background:rgba(201,168,76,.1)}
.btn-icon.danger{color:#E0524C;border-color:rgba(224,82,82,.3)}
.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:6px}
.badge.pendiente{background:rgba(232,168,56,.15);color:#E8A838}
.badge.confirmado{background:rgba(76,175,125,.15);color:#4CAF7D}
.empty{text-align:center;padding:40px;color:rgba(248,245,238,.4);font-size:14px}
.det-block{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:18px;margin-bottom:14px}
.det-title{font-size:11px;color:rgba(248,245,238,.5);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
#toast{position:fixed;top:20px;right:20px;background:#141414;border-left:3px solid #C9A84C;padding:14px 22px;border-radius:8px;font-size:13px;z-index:9999;display:none;max-width:380px}
#toast.err{border-color:#E0524C}
#toast.ok{border-color:#4CAF7D}
input[type=number]{background:#141414;border:1px solid #2a2a2a;color:#F8F5EE;padding:9px 12px;border-radius:7px;font-family:inherit;font-size:13px;width:100%}
input[type=number]:focus{outline:none;border-color:#C9A84C}
</style>
</head>
<body>
<div id="root">
  <div class="login">
    <h1>JAM</h1>
    <p>Panel administrador</p>
    <input type="password" id="loginPwd" placeholder="Clave" autocomplete="off">
    <button onclick="tryLogin()">Ingresar</button>
  </div>
</div>
<div id="toast"></div>
<script>
const SB_URL = "https://paexpktmcytccjphoppu.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZXhwa3RtY3l0Y2NqcGhvcHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDg3MzIsImV4cCI6MjA5NDg4NDczMn0.iKuJJm2-8KITTLwHOY1YrbzRgXcuAERXtHg7cQ_K3Yg";
const ADMIN_PWD = "jam2026admin";
const INSTANCIAS = {
  reg: { label: "Sedes", code: "JAM-REG", offset: 1 },
  rep: { label: "Repechaje", code: "JAM-REP", offset: 10 },
  nac: { label: "Nacional", code: "JAM-NAC", offset: 200 },
  int: { label: "Inter América", code: "JAM-INTER", offset: 1000 }
};
let allInscriptos = [], codesById = {}, currentTab = "inscriptos", preciosConfig = null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function toast(t,m){const x=$("toast");x.className=t;x.textContent=m;x.style.display="block";setTimeout(()=>x.style.display="none",3500)}
function tryLogin(){if($("loginPwd").value===ADMIN_PWD)initApp();else toast("err","Clave incorrecta")}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement===$("loginPwd"))tryLogin()});
async function initApp(){
  $("root").innerHTML = '<div class="app" style="display:block"><div class="topbar"><div><h1>JAM</h1><div class="subtitle">Panel director · 2026</div></div><button class="logout" onclick="logout()">Cerrar sesión</button></div><div class="stats" id="stats"></div><div class="tabs"><div class="tab active" onclick="switchTab(\'inscriptos\')">Inscriptos <span id="cnt-ins">0</span></div><div class="tab" onclick="switchTab(\'dj\')">DJ Mode</div><div class="tab" onclick="switchTab(\'sistema\')">Sistema</div><div class="tab" onclick="switchTab(\'precios\')">💰 Precios</div></div><div id="pane-inscriptos" class="tab-pane active"></div><div id="pane-dj" class="tab-pane"></div><div id="pane-sistema" class="tab-pane"></div><div id="pane-precios" class="tab-pane"></div></div>';
  await loadInscriptos();
  renderActiveTab();
}
function logout(){location.reload()}
async function loadInscriptos(){
  try{
    const r = await fetch(SB_URL+"/rest/v1/inscripciones?select=*&order=created_at.asc",{headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON}});
    allInscriptos = await r.json();
    computeAllCodes();
    updateStats();
  }catch(e){toast("err","Error cargando: "+e.message)}
}
function computeAllCodes(){
  codesById = {};
  const groups = {reg:[],rep:[],nac:[],int:[]};
  allInscriptos.forEach(ins=>{if(groups[ins.instancia])groups[ins.instancia].push(ins)});
  Object.keys(groups).forEach(k=>{
    const cfg = INSTANCIAS[k];
    groups[k].forEach((ins,idx)=>{
      const num = String(cfg.offset+idx).padStart(4,"0");
      codesById[ins.id] = cfg.code+"-"+num;
    });
  });
}
function getCodigo(ins){return codesById[ins.id]||"JAM-???"}
function updateStats(){
  const total = allInscriptos.length;
  const conf = allInscriptos.filter(i=>i.pago_estado==="confirmado").length;
  const pend = total-conf;
  let ars=0,usd=0;
  allInscriptos.forEach(i=>{if(i.moneda==="ARS")ars+=Number(i.monto_total||0);else if(i.moneda==="USD")usd+=Number(i.monto_total||0)});
  $("cnt-ins").textContent = total;
  $("stats").innerHTML = '<div class="stat gold"><div class="stat-label">Inscriptos</div><div class="stat-value">'+total+'</div></div><div class="stat green"><div class="stat-label">A recaudar ARS</div><div class="stat-value">$ '+ars.toLocaleString("es-AR")+'</div></div><div class="stat green"><div class="stat-label">A recaudar USD</div><div class="stat-value">$ '+usd.toLocaleString("en-US")+'</div></div><div class="stat amber"><div class="stat-label">Pendientes / Confirmados</div><div class="stat-value">'+pend+' / '+conf+'</div></div>';
}
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-pane").forEach(t=>t.classList.remove("active"));
  const idx=["inscriptos","dj","sistema","precios"].indexOf(tab);
  document.querySelectorAll(".tab")[idx].classList.add("active");
  $("pane-"+tab).classList.add("active");
  renderActiveTab();
}
function renderActiveTab(){
  if(currentTab==="inscriptos")renderInscriptos();
  else if(currentTab==="dj")renderDJ();
  else if(currentTab==="sistema")renderSistema();
  else if(currentTab==="precios")renderPrecios();
}
function renderInscriptos(){
  if(!allInscriptos.length){$("pane-inscriptos").innerHTML='<div class="empty">No hay inscripciones todavía.</div>';return}
  const list = allInscriptos.map(ins=>{
    const cod = getCodigo(ins);
    const inst = INSTANCIAS[ins.instancia]?.label || ins.instancia;
    const monto = (ins.moneda||"ARS")+" "+Number(ins.monto_total||0).toLocaleString("es-AR");
    const pago = ins.pago_estado==="confirmado"?'<span class="badge confirmado">Pago OK</span>':'<span class="badge pendiente">Pendiente</span>';
    return '<div class="ins-row"><div><div class="ins-codigo">'+esc(cod)+'</div>'+pago+'</div><div><div class="ins-nombre">'+esc(ins.nombre_grupo||ins.nombre)+'</div><div class="ins-meta">'+esc(inst)+' · '+esc(ins.email)+' · '+esc(ins.celular||"")+(ins.pais?' · '+esc(ins.pais):"")+'</div></div><div class="ins-monto">'+esc(monto)+'</div><div class="ins-actions"><button class="btn-icon" onclick="verIns(\''+ins.id+'\')">↗ Ver</button><button class="btn-icon" onclick="confirmarPago(\''+ins.id+'\')">✓ Pago</button><button class="btn-icon" onclick="reenviarMail(\''+ins.id+'\')">✉ Mail</button><button class="btn-icon danger" onclick="eliminarInscripcion(\''+ins.id+'\',\''+cod+'\')">🗑 Borrar</button></div></div>';
  }).join("");
  $("pane-inscriptos").innerHTML = '<div class="toolbar"><input class="search-box" id="searchBox" placeholder="Buscar..." oninput="filterInscriptos()"><button class="btn-primary" onclick="exportCsv()">Exportar CSV</button><button class="btn-secondary" onclick="loadInscriptos().then(renderActiveTab)">↻ Refrescar</button></div><div id="ins-list">'+list+'</div>';
}
function verIns(id){window.open("/check?id="+id,"_blank")}
function filterInscriptos(){
  const q=($("searchBox").value||"").toLowerCase().trim();
  document.querySelectorAll(".ins-row").forEach(row=>{row.style.display=!q||row.textContent.toLowerCase().includes(q)?"":"none"});
}
async function confirmarPago(id){
  if(!confirm("¿Confirmar pago?"))return;
  try{
    const r=await fetch(SB_URL+"/rest/v1/inscripciones?id=eq."+id,{method:"PATCH",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},body:JSON.stringify({pago_estado:"confirmado"})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const i=allInscriptos.find(x=>x.id===id);if(i)i.pago_estado="confirmado";
    updateStats();renderActiveTab();toast("ok","Pago confirmado ✓");
  }catch(e){toast("err","Error: "+e.message)}
}
async function reenviarMail(id){
  if(!confirm("¿Reenviar mail?"))return;
  try{
    const r=await fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
    const d=await r.json();
    if(d.mail_participante?.ok)toast("ok","Mail reenviado ✓");
    else toast("err","Error: "+(d.error||"desconocido"));
  }catch(e){toast("err","Error: "+e.message)}
}
async function eliminarInscripcion(id,codigo){
  const c=prompt("Para eliminar "+codigo+" escribí: BORRAR");
  if(c!=="BORRAR"){toast("err","Cancelado");return}
  try{
    const r=await fetch(SB_URL+"/rest/v1/inscripciones?id=eq."+id,{method:"DELETE",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    allInscriptos=allInscriptos.filter(x=>x.id!==id);
    computeAllCodes();updateStats();renderActiveTab();
    toast("ok","Inscripción "+codigo+" eliminada ✓");
  }catch(e){toast("err","Error: "+e.message)}
}
async function resetAll(){
  const c1=prompt("⚠️ Elimina TODAS las inscripciones + archivos. Confirmar escribiendo: BORRAR TODO");
  if(c1!=="BORRAR TODO"){toast("err","Cancelado");return}
  if(!confirm("ÚLTIMA CONFIRMACIÓN: ¿Borrar todo?"))return;
  try{
    const r=await fetch(SB_URL+"/rest/v1/inscripciones?created_at=lt.2099-01-01",{method:"DELETE",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,Prefer:"return=representation"}});
    const del=await r.json();const n=Array.isArray(del)?del.length:0;
    async function clean(b){
      const rl=await fetch(SB_URL+"/storage/v1/object/list/"+b,{method:"POST",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},body:JSON.stringify({limit:500,offset:0,prefix:"",sortBy:{column:"name",order:"asc"}})});
      const fs=await rl.json();
      if(!Array.isArray(fs)||!fs.length)return 0;
      const rd=await fetch(SB_URL+"/storage/v1/object/"+b,{method:"DELETE",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},body:JSON.stringify({prefixes:fs.map(f=>f.name)})});
      return rd.ok?fs.length:0;
    }
    const m=await clean("musica");const c=await clean("comprobantes");
    allInscriptos=[];computeAllCodes();updateStats();renderActiveTab();
    toast("ok","Reset OK: "+n+" inscripciones + "+m+" músicas + "+c+" comprobantes");
  }catch(e){toast("err","Error: "+e.message)}
}
function exportCsv(){
  const headers=["Codigo","Instancia","Nombre","Grupo","Email","Celular","Pais","Modalidad","Monto","Moneda","Pago","Musica","Fecha"];
  const rows=allInscriptos.map(ins=>[getCodigo(ins),INSTANCIAS[ins.instancia]?.label||ins.instancia,ins.nombre||"",ins.nombre_grupo||"",ins.email||"",ins.celular||"",ins.pais||"",ins.modalidad||"",ins.monto_total||0,ins.moneda||"",ins.pago_estado||"",ins.musica_estado||"",(ins.created_at||"").substring(0,19)]);
  const csv=[headers,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="inscriptos-jam-"+new Date().toISOString().substring(0,10)+".csv";a.click();
  toast("ok","CSV exportado ✓");
}
function renderDJ(){
  const c=allInscriptos.filter(i=>i.musica_estado==="cargada");
  if(!c.length){$("pane-dj").innerHTML='<div class="empty">No hay músicas cargadas todavía.</div>';return}
  const list=c.map(ins=>{
    const cod=getCodigo(ins);
    return '<div class="ins-row"><div><div class="ins-codigo">'+esc(cod)+'</div></div><div><div class="ins-nombre">'+esc(ins.nombre_grupo||ins.nombre)+'</div><div class="ins-meta">'+esc(ins.musica_nombre||"")+'</div></div><div></div><div class="ins-actions"><button class="btn-icon" onclick="window.open(\''+esc(ins.musica_url)+'\',\'_blank\')">▶ Reproducir</button></div></div>';
  }).join("");
  $("pane-dj").innerHTML=list;
}
function renderSistema(){
  $("pane-sistema").innerHTML='<div class="det-block"><div class="det-title">URLs del sistema</div><div style="font-family:monospace;font-size:12px;color:#F8F5EE;line-height:1.9">Portal: <a href="/" target="_blank" style="color:#C9A84C">/</a><br>Check QR: <a href="/check" target="_blank" style="color:#C9A84C">/check?id=...</a><br>Música: <a href="/musica" target="_blank" style="color:#C9A84C">/musica?token=...</a><br>Términos Nacional (PDF): <a href="/terminos-nacional.pdf" target="_blank" style="color:#C9A84C">/terminos-nacional.pdf</a><br>Términos Inter (PDF): <a href="/terminos-internacional.pdf" target="_blank" style="color:#C9A84C">/terminos-internacional.pdf</a></div></div><div class="det-block" style="border-color:rgba(224,82,82,.3);background:#1a0000"><div class="det-title" style="color:#E0524C">⚠️ Zona Peligrosa</div><div style="font-size:12px;color:rgba(248,245,238,.6);margin:10px 0;line-height:1.5">Eliminar TODAS las inscripciones y archivos. <strong style="color:#E0524C">Acción irreversible.</strong></div><button style="background:#E0524C;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:1px" onclick="resetAll()">🗑️ RESET TOTAL DEL SISTEMA</button></div>';
}
async function loadPrecios(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/config_precios?id=eq.1&select=*",{headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON}});
    const d=await r.json();
    preciosConfig=d[0]?.config||null;
    return preciosConfig;
  }catch(e){toast("err","Error: "+e.message);return null}
}
function getCategoriaExtraActual(extras){
  if(!extras)return{value:0,periodo:"—"};
  const m=new Date().getMonth()+1;
  if(m>=4&&m<=5)return{value:extras.abril_mayo||0,periodo:"Abril–Mayo"};
  if(m>=6&&m<=7)return{value:extras.junio_julio||0,periodo:"Junio–Julio"};
  if(m>=8&&m<=9)return{value:extras.agosto_septiembre||0,periodo:"Agosto–Septiembre"};
  return{value:0,periodo:"Fuera de temporada"};
}
async function renderPrecios(){
  if(!preciosConfig)await loadPrecios();
  if(!preciosConfig){$("pane-precios").innerHTML='<div class="empty">No se pudo cargar la configuración.</div>';return}
  const cfg=preciosConfig;
  const e=getCategoriaExtraActual(cfg.internacional?.categoria_extra);
  const mes=new Date().toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  $("pane-precios").innerHTML='<div class="stats"><div class="stat gold"><div class="stat-label">Mes actual</div><div class="stat-value" style="font-size:20px;text-transform:capitalize">'+mes+'</div></div><div class="stat green"><div class="stat-label">Cat. extra HOY (INT)</div><div class="stat-value">USD '+e.value+'</div></div><div class="stat"><div class="stat-label">Período activo</div><div class="stat-value" style="font-size:18px">'+e.periodo+'</div></div></div><div class="det-block"><div class="det-title" style="color:#C9A84C">Eventos Nacionales (ARS)</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px"><div><label class="det-title">Sedes Regionales</label><input id="p-sedes" type="number" value="'+(cfg.nacional?.sedes_ars||0)+'"></div><div><label class="det-title">Repesca</label><input id="p-repesca" type="number" value="'+(cfg.nacional?.repesca_ars||0)+'"></div><div><label class="det-title">Nacional · Solista</label><input id="p-nac-solo" type="number" value="'+(cfg.nacional?.nacional_solista_ars||0)+'"></div><div><label class="det-title">Nacional · Grupo</label><input id="p-nac-grupo" type="number" value="'+(cfg.nacional?.nacional_grupo_ars||0)+'"></div></div></div><div class="det-block"><div class="det-title" style="color:#C9A84C">Inter América (USD)</div><div style="max-width:280px;margin-top:12px"><label class="det-title">Base inscripción</label><input id="p-int-base" type="number" value="'+(cfg.internacional?.base_usd||0)+'"></div><div style="margin-top:18px;padding:14px;background:#1a1600;border-radius:10px;border:1px solid rgba(201,168,76,.2)"><div class="det-title" style="color:#C9A84C">Categoría EXTRA por mes (USD)</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px"><div><label class="det-title">Abril – Mayo</label><input id="p-int-abrmay" type="number" value="'+(cfg.internacional?.categoria_extra?.abril_mayo||0)+'"></div><div><label class="det-title">Junio – Julio</label><input id="p-int-junjul" type="number" value="'+(cfg.internacional?.categoria_extra?.junio_julio||0)+'"></div><div><label class="det-title">Agosto – Septiembre</label><input id="p-int-agosep" type="number" value="'+(cfg.internacional?.categoria_extra?.agosto_septiembre||0)+'"></div></div><div style="font-size:11px;color:rgba(248,245,238,.5);margin-top:10px;line-height:1.5">Se SUMA al precio base por cada categoría extra. Aplica solo a Inter América.</div></div></div><div style="text-align:center;padding:14px"><button class="btn-primary" onclick="savePrecios()" style="padding:13px 32px;font-size:13px">💾 GUARDAR CAMBIOS</button><div style="font-size:11px;color:rgba(248,245,238,.45);margin-top:8px">Aplica a inscripciones nuevas.</div></div>';
}
async function savePrecios(){
  if(!confirm("¿Guardar cambios? Aplicarán a las próximas inscripciones."))return;
  const c={nacional:{sedes_ars:parseInt($("p-sedes").value)||0,repesca_ars:parseInt($("p-repesca").value)||0,nacional_solista_ars:parseInt($("p-nac-solo").value)||0,nacional_grupo_ars:parseInt($("p-nac-grupo").value)||0},internacional:{base_usd:parseInt($("p-int-base").value)||0,categoria_extra:{abril_mayo:parseInt($("p-int-abrmay").value)||0,junio_julio:parseInt($("p-int-junjul").value)||0,agosto_septiembre:parseInt($("p-int-agosep").value)||0}}};
  try{
    const r=await fetch(SB_URL+"/rest/v1/config_precios?id=eq.1",{method:"PATCH",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},body:JSON.stringify({config:c,updated_at:new Date().toISOString()})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    preciosConfig=c;toast("ok","Precios guardados ✓");renderPrecios();
  }catch(e){toast("err","Error: "+e.message)}
}
</script>
