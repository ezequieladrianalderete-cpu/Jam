<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0a0a" />
<title>JAM 2026 — Verificación de inscripción</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #f5f5f5; min-height: 100vh; padding: 20px; display: flex; align-items: flex-start; justify-content: center; }
  .wrap { width: 100%; max-width: 540px; }
  .header { text-align: center; margin-bottom: 24px; padding-top: 20px; }
  .header h1 { color: #d32f2f; font-size: 32px; margin-bottom: 6px; letter-spacing: 1px; }
  .header p { color: #888; font-size: 14px; }
  .card { background: #1a1a1a; border-radius: 14px; padding: 26px; margin-bottom: 16px; border: 1px solid #2a2a2a; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .codigo-grande { text-align: center; padding: 18px 12px; background: linear-gradient(135deg, #d32f2f, #b71c1c); border-radius: 12px; margin: -10px -10px 18px -10px; }
  .codigo-grande .label { color: rgba(255,255,255,0.75); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; font-weight: 600; }
  .codigo-grande .val { color: #fff; font-size: 28px; font-weight: 800; font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 2px; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #2a2a2a; font-size: 14px; gap: 12px; }
  .meta-row:last-child { border: 0; }
  .meta-row .k { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; min-width: 110px; }
  .meta-row .v { color: #fff; font-weight: 600; text-align: right; word-break: break-word; flex: 1; }
  .badge { padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; }
  .badge.nac { background: #1976d2; }
  .badge.int { background: #d32f2f; }
  .badge.rep { background: #7b1fa2; }
  .badge.reg { background: #455a64; }
  .badge.confirmado { background: #388e3c; }
  .badge.pendiente { background: #f57c00; }
  .badge.cargada { background: #388e3c; }
  .badge.musica-pend { background: #455a64; }
  .loading { text-align: center; padding: 80px 20px; color: #888; }
  .spinner { display: inline-block; width: 50px; height: 50px; border: 3px solid #333; border-top-color: #d32f2f; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alert { padding: 16px; border-radius: 10px; margin: 14px 0; font-size: 14px; line-height: 1.6; }
  .alert.err { background: rgba(211, 47, 47, 0.15); border-left: 3px solid #d32f2f; color: #ff8a80; }
  .alert.ok { background: rgba(56, 142, 60, 0.15); border-left: 3px solid #388e3c; color: #81c784; }
  .footer { text-align: center; margin-top: 24px; color: #555; font-size: 11px; line-height: 1.7; }
  .footer strong { color: #aaa; }
  .qr-self { text-align: center; margin: 16px 0; }
  .qr-self img { max-width: 180px; border: 3px solid #fff; border-radius: 8px; padding: 4px; background: #fff; }
  .timestamp { color: #555; font-size: 10px; text-align: center; margin-top: 14px; font-family: ui-monospace, monospace; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions a { flex: 1; padding: 11px; background: #d32f2f; color: #fff; text-decoration: none; border-radius: 8px; text-align: center; font-weight: 600; font-size: 13px; }
  .actions a.secondary { background: #333; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>JAM 2026</h1>
    <p>Verificación de inscripción</p>
  </div>

  <div id="content">
    <div class="card">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top:18px">Buscando tu inscripción...</p>
      </div>
    </div>
  </div>

  <div class="footer">
    <strong>JAM Dance Competition 2026</strong><br>
    2, 3 y 4 de Octubre · Palais Rouge, CABA<br>
    Jerónimo Salguero 1441
  </div>
</div>

<script>
const SB_URL  = "https://paexpktmcytccjphoppu.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZXhwa3RtY3l0Y2NqcGhvcHB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDg3MzIsImV4cCI6MjA5NDg4NDczMn0.iKuJJm2-8KITTLwHOY1YrbzRgXcuAERXtHg7cQ_K3Yg";

function esc(s){return (s==null?"":String(s)).replace(/[<>&"]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"}[c]));}

async function init(){
  var params = new URLSearchParams(location.search);
  var id = params.get("id");
  if (!id) return showErr("Falta el parámetro id", "Esta página necesita un ID de inscripción. Si llegaste por un mail o QR, asegurate de usar el link completo.");
  if (!/^[0-9a-f-]{30,}$/i.test(id)) return showErr("ID inválido", "El identificador no tiene el formato correcto.");

  try {
    var r = await fetch(SB_URL + "/rest/v1/inscripciones?id=eq." + encodeURIComponent(id) + "&select=*", {
      headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON }
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    var rows = await r.json();
    if (!rows.length) return showErr("Inscripción no encontrada", "No hay una inscripción con ese ID. Verificá el link.");
    var ins = rows[0];

    // Calcular código legible secuencial JAM-{INST}-NNNN
    var seqResp = await fetch(SB_URL + "/rest/v1/inscripciones?instancia=eq." + encodeURIComponent(ins.instancia) + "&created_at=lte." + encodeURIComponent(ins.created_at) + "&select=id&order=created_at.asc", {
      headers: { apikey: SB_ANON, Authorization: "Bearer " + SB_ANON }
    });
    var seqRows = await seqResp.json();
    var pos = seqRows.findIndex(x => x.id === ins.id) + 1;
    if (pos < 1) pos = seqRows.length;
    var seq = String(pos).padStart(4, "0");
    var codigoLegible = "JAM-" + (ins.instancia||"").toUpperCase() + "-" + seq;

    render(ins, codigoLegible);
  } catch (e) {
    showErr("Error de conexión", "No pudimos consultar la base de datos. Intentá de nuevo más tarde.");
    console.error(e);
  }
}

function showErr(title, msg){
  document.getElementById("content").innerHTML =
    '<div class="card"><h2 style="color:#ff5252;margin-bottom:12px;font-size:18px">' + esc(title) + '</h2><div class="alert err">' + esc(msg) + '</div></div>';
}

function row(k, v){return '<div class="meta-row"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';}

function render(ins, codigoLegible){
  var inst = (ins.instancia || "").toLowerCase();
  var instName = {reg:"Sedes / Pre-Inscripción", nac:"Final Nacional", int:"Final Internacional", rep:"Repechaje"}[inst] || inst;
  var pe = ins.pago_estado || "pendiente";
  var me = ins.musica_estado || "pendiente";
  var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(location.href);

  var html = '<div class="card">' +
    '<div class="codigo-grande">' +
      '<div class="label">Código de participante</div>' +
      '<div class="val">' + esc(codigoLegible) + '</div>' +
    '</div>' +
    row("Nombre", esc(ins.nombre || "—")) +
    row("Instancia", '<span class="badge ' + inst + '">' + (ins.instancia||"").toUpperCase() + '</span> <span style="color:#888;font-size:11px">' + esc(instName) + '</span>') +
    (ins.sede_nombre ? row("Sede", esc(ins.sede_nombre)) : "") +
    row("Modalidad", esc(ins.modalidad || "—") + (ins.cant_personas > 1 ? ' <span style="color:#888;font-size:11px">(' + ins.cant_personas + ' personas)</span>' : "")) +
    (ins.pais ? row("País", esc(ins.pais)) : "") +
    row("Monto", (ins.moneda || "ARS") + " " + (+(ins.monto_total||0)).toLocaleString("es-AR")) +
    row("Pago", '<span class="badge ' + pe + '">' + esc(pe) + '</span>') +
    row("Música", '<span class="badge ' + (me === "cargada" ? "cargada" : "musica-pend") + '">' + esc(me) + '</span>') +
    row("Fecha inscripción", ins.created_at ? new Date(ins.created_at).toLocaleString("es-AR") : "—") +
  '</div>';

  html += '<div class="card"><h2 style="color:#ff5252;margin-bottom:12px;font-size:14px;text-transform:uppercase;letter-spacing:0.5px">Código QR</h2>' +
    '<div class="qr-self"><img src="' + qrUrl + '" alt="QR de esta página" /></div>' +
    '<p style="text-align:center;color:#888;font-size:12px">Esta misma URL escaneada como QR</p></div>';

  document.getElementById("content").innerHTML = html;
}

init();
</script>
</body>
  </html>
